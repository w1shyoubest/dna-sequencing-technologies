<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVITI-style two-sided sequencer</title><style>.controls .ctl:nth-child(1),.controls .ctl:nth-child(2){display:none!important}</style></head><body>
<script src="core.js"></script>
<script>
/* AVITI-style benchtop sequencer, two sided. 1 unit = 1 cm. x = depth (front face at x = XF), y = width, z = up.
   Reference for the architecture: Arslan et al., Nat Biotechnol 2024: "two flowcells run in parallel through two
   fluidics modules and one shared imaging module". The box, bay layout and sizes are an approximation of Element's
   instrument, not a measured drawing.

   HOW IT REALLY WORKS (per side; the sides are independent)
   1. The flow cell (2 lanes, carrier + glass) goes through the side's door onto its temperature-controlled stage,
      against a fluidic manifold. The reagent cartridge slides into the chilled slot under the stage; sippers reach
      into its wells (library circles, hybridization buffer, RCA mix, sequencing primer, avidites A C G T, engineered
      polymerase, step + unblock mix, wash). A wash buffer bottle and a shared waste bottle stand at the back.
   2. HYBRIDIZE: circles are pumped over the lane and pair with surface primers.
   3. POLONY GENERATION: RCA mix (strand-displacing polymerase + dNTPs) copies each circle into one long strand.
   4. 300 CYCLES (2 x 150) of sequencing by avidity: bind avidites + polymerase; image in 4 channels; wash them off;
      step with an unlabelled 3'-blocked nucleotide; unblock. After cycle 150, a paired-end turn, then read 2.
   The imaging module (objective + camera + light source on a carriage) rides a rail across both stages. It serves one
   side at a time: a side that is ready to image while the other is being imaged waits. (Element documents one shared
   imaging module and two independently controlled sides; whether the optics move or the stages move is not published,
   so the moving carriage is a drawing choice.)
   Verified from Element's specification sheet: dual flow cells, each a two-lane glass substrate in a plastic cartridge;
   kits 2 x 75, 2 x 150, 2 x 300; >= 1 billion read pairs per flow cell; 2 x 150 high output in 38 h; instrument
   29.5 x 37.6 x 28.5 in (H x W x D), 155 kg. The box here is drawn smaller than life.

   PARTS  CASE  shell . fascia . touch screen . door A, door B (bottom hinge) . back: grille, plate, inlet, ports
          STRUCTURE  base plate . bulkhead . deck plate on posts
          PER SIDE   stage heat sink . Peltier . stage plate . manifold . chiller sink + Peltier + cold plate + fan .
                     sipper bar + 4 sippers . valve stand + selector valve . syringe pump (motor, barrel, plunger) .
                     wash bottle + sipper . tubes: sippers->valve, bottle->valve, valve->manifold, manifold->pump, pump->waste
          IMAGING    2 uprights . rail . lead screw . scan motor . carriage . optics body . objective . camera . 2 LEDs
          POWER      inlet + cord . power supply . main board . case fan . computer . ribbon . harnesses . waste bottle */
const XB = 6, XF = 66, Y0 = 8, Y1 = 82, ZB = 2, ZT = 58, BX = 100, BY = 92;
const OUT = rrUV(Y0, ZB, Y1, ZT, 4);
const SIDE = { A: { yc: 61 }, B: { yc: 29 } }, KEYS = ['A', 'B'];
const CREAM = '#f6f2e6', RECESS = '#2b2523', SCREENC = '#1d2a26', GRN = '#8af0ae';
const BASES = 'ACGT', BCOL = ['#43c25c', '#4aa3ff', '#f4c430', '#e2483d'];
const DOORM = matOf('#f1ede0'), FCM = matOf('#56626d'), CARTM = matOf('#f3f1ea'), PCB = matOf('#3f8f5a'), COLD = matOf('#b9d4e6'), GREY = matOf('#c3cacc'), STEEL = matOf('#aab2b5');
const RLEN = 300, CYCN = [1, 2, 3, 150, 151, 152, 153, 300], NC = CYCN.length, CYC = 1.6;
const REAG = [ { i:3, j:0, name:'LIBRARY CIRCLES', col:'#e2a9c4', k:'hyb' }, { i:3, j:1, name:'HYB BUFFER', col:'#c9c1b2', k:'hyb' }, { i:3, j:2, name:'RCA MIX', col:'#ffb37a', k:'rca' },
  { i:2, j:0, name:'SEQ PRIMER', col:'#b7a6ea', k:'' }, { i:2, j:1, name:'AVIDITES A C G T', col:'#f3a6bb', k:'bind' }, { i:2, j:2, name:'POLYMERASE', col:'#8fd9d1', k:'bind' },
  { i:1, j:0, name:'STEP MIX', col:'#f4d35e', k:'step' }, { i:1, j:1, name:'UNBLOCK MIX', col:'#a8e6a1', k:'step' }, { i:1, j:2, name:'WASH', col:'#dfe5e6', k:'wash' } ];
const baseOf = (i, c) => (i*7 + c*3 + (((i + 1)*(c + 2)*5) >> 1) + i*i) % 4;
const FP = (uv, dx = .3) => on(PX(XF + dx), uv);
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const bbOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
const mu = w => `style="stroke-width:${w.toFixed(2)}"`, c01 = v => Math.max(0, Math.min(1, v));
function sqSort(parts){
  parts = parts.filter(Boolean); const n = parts.length, scr = parts.map(p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const x of [p.box[0][0], p.box[1][0]]) for (const y of [p.box[0][1], p.box[1][1]]) for (const z of [p.box[0][2], p.box[1][2]]){ const q = P(x, y, z); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); } return [x0, y0, x1, y1]; });
  const dep = parts.map(p => depthOf(boxMid(p.box))), after = parts.map(() => []), need = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const a = scr[i], b = scr[j]; if (a[2] < b[0] || b[2] < a[0] || a[3] < b[1] || b[3] < a[1]) continue;
    const o = sepOrder(parts[i], parts[j]); if (o < 0){ after[i].push(j); need[j]++; } else if (o > 0){ after[j].push(i); need[i]++; } }
  const done = new Array(n).fill(false); let out = '';
  for (let c = 0; c < n; c++){ let best = -1, free = false; for (let i = 0; i < n; i++){ if (done[i]) continue; const fr = need[i] === 0; if (best < 0 || (fr && !free) || (fr === free && dep[i] < dep[best])){ best = i; free = fr; } }
    done[best] = true; out += parts[best].svg; for (const j of after[best]) need[j]--; }
  return out;
}

/* ---------- per-side run state ---------- */
const phaseOf = S => { if (S.run !== 'run') return S.run; const p = S.ph; return p < .3 ? 'bind' : p < .6 ? 'img' : p < .8 ? 'wash' : 'step'; };
const cycNo = S => S.run === 'done' ? RLEN : S.run === 'turn' ? 150 : S.run === 'run' ? CYCN[S.cyc] : 0;
const readOf = S => { const n = S.run === 'done' ? NC : S.run === 'run' || S.run === 'turn' ? S.cyc + (S.run === 'run' && S.ph >= .6 ? 1 : 0) : 0;
  const r = Array.from({length:n}, (_, c) => BASES[baseOf(0, c)]); const part = (a, b) => { const q = r.slice(a, b).join(''); return q.length === 4 ? q.slice(0, 3) + '..' + q[3] : q; }; return [part(0, 4), part(4, 8)].filter(Boolean).join(' '); };
const ACTIVE = S => S.run !== 'idle' && S.run !== 'done';
const reagKey = S => { const p = phaseOf(S); return p === 'hyb' ? 'hyb' : p === 'rca' ? 'rca' : p === 'bind' ? 'bind' : p === 'wash' ? 'wash' : p === 'step' ? 'step' : ''; };

/* ---------- consumables ---------- */
const FC0 = k => k === 'A' ? [70, 47, 2.05] : [70, 33, 2.05], RC0 = k => k === 'A' ? [80, 58, 2.05] : [80, 14, 2.05];
function fcPos(k, t){ const yc = SIDE[k].yc, a = FC0(k), b = [XF + 1.5, yc - 5.5, 30.02], c = [46, yc - 5.5, 29.02];
  if (t <= .6){ const u = t/.6, uz = Math.min(1, u*1.6); return [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u, a[2] + (b[2]-a[2])*uz]; } const u = (t - .6)/.4; return [b[0] + (c[0]-b[0])*u, b[1], b[2] + (c[2]-b[2])*u]; }
function rcPos(k, t){ const yc = SIDE[k].yc, a = RC0(k); if (t <= .3) return [a[0], a[1], a[2] + 10*(t/.3)];
  if (t <= .65){ const u = (t - .3)/.35; return [a[0] + (XF + 1 - a[0])*u, a[1] + (yc - 8 - a[1])*u, 12.05 - 3*u]; } const u = (t - .65)/.35; return [XF + 1 - (XF + 1 - 44)*u, yc - 8, 9.05]; }
// flow cell: 4.2 (x) by 11 (y) by 0.6, two lanes; drawn only between xa and xb
function sqFlowCell(S, x0, y0, z, xa, xb){
  const a = Math.max(x0, xa), b = Math.min(x0 + 4.2, xb); if (b - a < .05) return '';
  const zt = z + .63, cl = u => Math.max(a, Math.min(b, x0 + u)), rect = (u0, v0, u1, v1) => { const p = cl(u0), q = cl(u1); return q - p < .05 ? null : [[p, y0+v0, zt], [q, y0+v0, zt], [q, y0+v1, zt], [p, y0+v1, zt]]; };
  const ph = phaseOf(S), wet = ph === 'hyb' || ph === 'rca' || ph === 'bind', used = S.run !== 'idle';
  let s = box(a, y0, z, b, y0 + 11, z + .6, FCM, toneI, .8), r;
  if ((r = rect(.6, 1.2, 3.6, 9.8))) s += shape(r, CLEAR.l, .6);
  for (let i = 0; i < 2; i++){ const u = .95 + i*1.3; if ((r = rect(u, 1.7, u + 1.0, 9.3))) s += shape(r, wet ? '#ffd3e4' : ph === 'wash' || ph === 'step' ? '#bfdcff' : '#cdeef4', .4);
    for (const v of [1.35, 9.65]) if (x0 + u + .5 > a + .2 && x0 + u + .5 < b - .2) s += fill(pd(on(PZ(zt), ellUV(x0 + u + .5, y0 + v, .18, .18, 6))), METAL.l); }
  let dc = ['', '', '', ''], d = '', called = S.run === 'done' ? NC : S.run === 'run' && S.ph >= .6 ? S.cyc + 1 : S.cyc;
  for (let i = 0; i < 14; i++){ const u = 1.05 + (i % 2)*1.3 + (i*37 % 13)/13*.8, v = 2.2 + (i*53 % 17)/17*6.6, X = x0 + u, Y = y0 + v; if (X < a + .2 || X > b - .2) continue;
    const q = pd([[X-.1, Y-.1, zt+.01], [X+.1, Y-.1, zt+.01], [X+.1, Y+.1, zt+.01], [X-.1, Y+.1, zt+.01]]); if (used && called > 0 && S.run !== 'hyb' && S.run !== 'rca') dc[baseOf(i, called - 1)] += q; else if (used && S.run !== 'hyb') d += q; }
  if (d) s += fill(d, '#ffffff', S.run === 'rca' ? `opacity="${f(S.ph)}"` : ''); dc.forEach((q, i) => { if (q) s += fill(q, BCOL[i]); });
  return s;
}
function sqCart(x0, y0, z, xa, xb, k){
  const a = Math.max(x0, xa), b = Math.min(x0 + 18, xb); if (b - a < .05) return '';
  let s = box(a, y0, z, b, y0 + 16, z + 11, CARTM, toneI, .9);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++){ const X = x0 + 3 + i*4, Y = y0 + 3.2 + j*4.8, rg = REAG.find(r => r.i === i && r.j === j); if (X - 1.6 > a && X + 1.6 < b) s += shape(on(PZ(z + 11.03), ellUV(X, Y, 1.5, 1.5, 12)), rg ? rg.col : '#dfe5e6', .5); }
  if (b >= x0 + 17.99 && facing([1,0,0])) s += shape(on(PX(b + .04), rrUV(y0 + 2, z + 2.5, y0 + 14, z + 8), .8), '#ffffff', .6) + tx(b + .08, y0 + 8, z + 4.4, 'SIDE ' + k, 2, INK, 800);
  return s;
}
const wellAt = (x0, y0, z, r) => [x0 + 3 + r.i*4, y0 + 3.2 + r.j*4.8, z + 11.05];

/* ---------- doors (bottom hinge, open outward and down) ---------- */
function sqPrismY(prof, y0, y1, m, w = 1){ const A = prof.map(([x, z]) => [x, y0, z]), B = prof.map(([x, z]) => [x, y1, z]); let s = loft(A, B, n => toneI(n, m));
  if (vis([0,1,0])) s += shape(B, toneI([0,1,0], m), .6); else if (vis([0,-1,0])) s += shape(A, toneI([0,-1,0], m), .6);
  return s + ink(pd([A[0], B[0], B[3], A[3]]), w*.7) + ink(pd([A[1], B[1], B[2], A[2]]), w*.7) + hullInk([...A, ...B], w + .8); }
const doorProf = a => { const t = a*88*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [[0,0],[.8,0],[.8,28],[0,28]].map(([dx, dz]) => [XF + .2 + dx*c + dz*s, 7 - dx*s + dz*c]); };

/* ---------- screen: both sides ---------- */
function sqScreen(st){
  const x = XF + .42, T = (y, z, str, size, col = GRN) => tx(x, y, z, str, size, col, 700); let s = T(45, 51.6, 'AVI-TWO . 2 SIDES . KITS 2 X 75 TO 2 X 300 . THIS RUN 2 X 150, ~38 H', 1.1, '#5fae82');
  KEYS.forEach((k, i) => { const S = st[k], yb = i === 0 ? 55 : 35, ph = phaseOf(S);
    const line1 = S.run === 'idle' ? (!S.fc ? 'LOAD FLOW CELL' : !S.rc ? 'LOAD REAGENTS' : 'READY') : S.run === 'done' ? 'RUN COMPLETE' : S.run === 'hyb' ? 'HYBRIDIZE CIRCLES' : S.run === 'rca' ? 'POLONY GENERATION' : S.run === 'turn' ? 'PAIRED-END TURN' : `CYCLE ${cycNo(S)}/${RLEN} . R${S.cyc < 4 ? 1 : 2} ${cycNo(S) - (S.cyc < 4 ? 0 : 150)}/150`;
    const line2 = S.run === 'run' ? (S.wait ? 'WAITING FOR CAMERA' : ph === 'bind' ? 'BIND AVIDITES' : ph === 'img' ? 'IMAGE 4 CHANNELS' : ph === 'wash' ? 'WASH AVIDITES OFF' : 'STEP + UNBLOCK') : S.run === 'rca' ? 'ROLLING CIRCLE AMP.' : S.run === 'done' ? '2 X 150, 8 CYCLES SHOWN' : S.run === 'hyb' ? 'CIRCLES ONTO PRIMERS' : S.run === 'turn' ? 'READ 2 NEXT' : S.fc && S.rc ? 'PRESS START' : '';
    s += T(yb, 48.4, 'SIDE ' + k, 1.3, '#f4c430') + T(yb, 45.6, line1, 1.45) + T(yb, 43.3, line2, 1.1, S.wait ? '#f4c430' : '#5fae82');
    // the side's lane picture: 8 polony dots, lit in the colour of the base just read
    const called = S.run === 'done' ? NC : S.run === 'run' && S.ph >= .6 ? S.cyc + 1 : S.run === 'run' ? S.cyc : 0;
    for (let j = 0; j < 8; j++){ const y = yb + 5.25 - (j % 4)*3.5, z = 40.4 - ((j / 4) | 0)*2.8, seen = called - (ph === 'img' && S.ph < .3 + .3*((j % 4) + .5)/4 ? 1 : 0) - (ph === 'bind' ? 1 : 0);
      const col = S.run === 'idle' || S.run === 'hyb' ? '#2f4a40' : S.run === 'rca' ? '#dfeee6' : seen <= 0 ? '#2f4a40' : BCOL[baseOf(j, Math.min(NC, seen) - 1)]; s += fill(pd(on(PX(x), ellUV(y, z, .9, .9, 10))), col); }
    s += T(yb, 34.8, readOf(S) || '-', 1.25, '#f6f2e6'); });
  return s;
}

/* ---------- case ---------- */
function sqBody(st, m, k){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), LEFT = facing([0,1,0]), RIGHT = facing([0,-1,0]);
  let s = '';
  if (FRONT) s += fill(pd(on(PX(XF), OUT)), tone([1,0,0], m)); if (BACK) s += fill(pd(on(PX(XB), OUT)), tone([-1,0,0], m));
  s += extrude(OUT, XB, XF, m);
  if (FRONT){
    s += shape(FP(rrUV(Y0 + 2.5, ZB + 2.5, Y1 - 2.5, ZT - 2.5, 2.5), .12), CREAM, 1.2);
    s += act('screen', shape(FP(rrUV(24, 32, 66, 54, 1.5), .22), '#3d3935', 1.1) + fill(pd(FP(rectUV(25.2, 33.1, 64.8, 52.9), .3)), SCREENC) + sqScreen(st));
    s += tx(XF + .3, 45, 29.6, 'AVI-TWO', 2.4, INK, 800) + tx(XF + .3, 45, 27.2, 'SEQUENCING BY AVIDITY', 1.0, '#857d6e', 700);
    for (const key of KEYS){ const S = st[key], yc = SIDE[key].yc, ph = phaseOf(S);
      s += shape(FP(rrUV(yc - 4, 38.2, yc + 4, 39.6, .6), .22), ACTIVE(S) ? (S.wait ? '#f4c430' : '#43c25c') : S.busy ? '#f4c430' : S.run === 'done' ? '#4aa3ff' : '#c9c1b2', .6);   // side status light
      s += tx(XF + .3, yc, 40.9, 'SIDE ' + key, 1.3, '#857d6e', 800);
      const ro = 1 - k;
      if (S.door > .01 && ro > .02){ const o = FP(rectUV(yc - 15, 7, yc + 15, 35), .2), p = fcPos(key, S.fcT), q = rcPos(key, S.rcT), cy = st.cy;
        const inner = fill(pd(o), RECESS) + box(40, yc - 9, 27, 62, yc + 9, 29, METAL, toneI, .7) + sqFlowCell(S, p[0], p[1], p[2], XB, XF)
          + box(43.5, yc - 10, 7.5, 63, yc + 10, 9, COLD, toneI, .7) + sqCart(q[0], q[1], q[2], XB, XF, key)
          + (Math.abs(cy - yc) < 12 ? box(48, cy - 2.5, 35, 56, cy + 2.5, 42, DARK, toneI, .7) + rod([52, cy, 35], [52, cy, 31], 1.3, METAL, toneI, .6, .9) : '');
        s += `<g opacity="${f(ro)}">` + clipTo(o, inner) + ink(pd(o), 1.6) + '</g>'; } }
    let v = ''; for (let z = 12; z <= 22; z += 2) v += pd(FP([[12, z], [20, z]], .22), false) + pd(FP([[78, z], [70, z]], .22), false); s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".7"/>`;
  }
  if (BACK){ const bp = (uv, dx = .2) => on(PX(XB - dx), uv);
    s += shape(bp(rrUV(58, 4, 76, 18, 1.5)), '#3d3935', 1) + shape(bp(rrUV(14, 4, 32, 18, 1.5)), '#3d3935', 1);
    let v = ''; for (let z = 6; z <= 16; z += 2) v += pd(bp([[60, z], [74, z]], .3), false) + pd(bp([[16, z], [30, z]], .3), false); for (let z = 40; z <= 50; z += 2) v += pd(bp([[20, z], [70, z]], .3), false);
    s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.3" opacity=".75"/>`;
    s += shape(bp(rrUV(36, 6, 54, 15, 1)), '#f3f0e6', .9) + txB(XB - .3, 45, 11.8, 'AVIDITY SEQUENCER', 1.5, INK, 800) + txB(XB - .3, 45, 9.4, 'REAL SIZE 96 X 72 X 75 CM, 155 KG', 1.1, INK, 700) + txB(XB - .3, 45, 7.4, 'DRAWN SMALLER', 1.1, '#857d6e', 700);
    s += shape(bp(rectUV(40, 20, 46, 25)), RECESS, .9) + shape(bp(rectUV(48, 21, 51.5, 23.6)), RECESS, .6) + shape(bp(rectUV(52.5, 21, 54.6, 22)), RECESS, .5); }
  if (RIGHT){ let v = ''; for (let z = 36; z <= 48; z += 2) v += pd([[16, Y0 - .15, z], [40, Y0 - .15, z]], false); s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.3" opacity=".75"/>`; }
  if (LEFT){ const sd = tone([0,1,0], m); s += shape(on(PY(Y1 + .15), rrUV(20, 36, 52, 48, 3)), mix(sd, '#ffffff', .22), 1) + txY(36, Y1 + .25, 39.6, 'AVI-TWO', 5.2, mix(sd, '#000000', .45), 800);
    let v = ''; for (let z = 8; z <= 16; z += 2) v += pd([[18, Y1 + .15, z], [36, Y1 + .15, z]], false); s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.3" opacity=".75"/>`; }
  s += ink(pd(on(PZ(ZT + .05), rrUV(12, 14, 36, 76, 2))), 1) + line([[40, 12, ZT + .05], [40, 78, ZT + .05]], .9);
  if (FRONT) s += ink(pd(on(PX(XF), OUT)), 2.2); if (BACK) s += ink(pd(on(PX(XB), OUT)), 2.2);
  return s + hullInk([...on(PX(XB), OUT), ...on(PX(XF), OUT)], 2.8);
}

/* ---------- see-through ---------- */
const T_IDLE = '#e9eef0', T_REAG = '#ff7fb6', T_BUF = '#58b4ff', T_WASTE = '#c9a24a';
let SEQ_LABELS = '';
function sqMech(st, k){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg }), L = [];
  const bx = (x0, y0, z0, x1, y1, z1, m, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, m, toneI, w));
  const rd = (a, b, r, m, w = .5, r1 = r) => { const R = Math.max(r, r1), bb = bbOf([a, b]); put([bb[0].map(v => v - R), bb[1].map(v => v + R)], rod(a, b, r, m, toneI, w, r1)); };
  const tube = (pts, col, w = .5) => { for (let i = 0; i < pts.length - 1; i++){ const d = pd([pts[i], pts[i+1]], false), bb = bbOf([pts[i], pts[i+1]]);
    put([bb[0].map(v => v - .3), bb[1].map(v => v + .3)], `<path d="${d}" fill="none" stroke="${INK}" ${mu(w + .28)} stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" ${mu(w)} stroke-linecap="round"/>`); } };
  const cy = st.cy, imgSide = KEYS.find(key => phaseOf(st[key]) === 'img' && !st[key].wait);
  // ---- structure
  bx(10, 10, 2.5, 64, 80, 3.4, STEEL); bx(32, 10, 3.4, 33, 80, 26, GREY);
  for (const [x, y] of [[36, 14], [36, 76], [62, 14], [62, 76]]) rd([x, y, 3.4], [x, y, 26], .5, METAL);
  bx(34, 12, 26, 64, 78, 27, GREY);
  // ---- per side: stage, chiller, cartridge, sippers, valve, pump, wash bottle, tubes

/* ---------- scene ---------- */

/* ---------- behaviour ---------- */
let ui;
function chain(S, steps, done){ let i = 0, t = 0; S.busy = true;
  ui.animate(dt => { const stp = steps[i]; t += dt; const u = Math.min(1, t / stp[0]); stp[1](ease(u)); if (u >= 1){ i++; t = 0; if (i >= steps.length){ S.busy = false; if (done) done(); return false; } } return true; }); }
const FC_IN = S => [[.45, u => S.door = u], [.9, u => S.fcT = .6*u], [.55, u => S.fcT = .6 + .4*u]], FC_OUT = S => [[.55, u => S.fcT = 1 - .4*u], [.9, u => S.fcT = .6*(1 - u)]];
const RC_IN = S => [[.5, u => S.rcT = .3*u], [.6, u => S.rcT = .3 + .35*u], [.6, u => S.rcT = .65 + .35*u], [.45, u => S.door = 1 - u]], RC_OUT = S => [[.6, u => S.rcT = 1 - .35*u], [.6, u => S.rcT = .65 - .35*u], [.5, u => S.rcT = .3*(1 - u)]];

function loadRC(S){ if (blocked(S)) return; if (S.rc) return ui.flash('Reagents ' + S.k + ' are already loaded'); if (S.run === 'done') return ui.flash('Unload the finished run first');

function unload(S){ if (blocked(S)) return; if (!S.fc && !S.rc) return ui.flash('Nothing to unload on side ' + S.k);
  chain(S, [[.45, u => S.door = u], ...(S.fc ? FC_OUT(S) : []), ...(S.rc ? RC_OUT(S) : []), [.45, u => S.door = 1 - u]], () => { S.fc = S.rc = 0; S.run = 'idle'; S.cyc = 0; S.ph = 0; S.wait = false; }); }
let loopOn = false;
function startRun(S){ if (blocked(S)) return; if (S.run === 'done') return ui.flash('Side ' + S.k + ' is finished: unload it'); if (!S.fc) return ui.flash('Load flow cell ' + S.k + ' first'); if (!S.rc) return ui.flash('Load reagents ' + S.k + ' first');
  S.run = 'hyb'; S.cyc = 0; S.ph = 0; S.said = {}; ui.flash('Side ' + S.k + ': circles hybridize to the surface primers', 2600); runLoop(); }
function runLoop(){ if (loopOn) return; loopOn = true; const st = ui.st;
  ui.animate(dt => { let busy = false;
    // the camera: go to the side that is imaging; a second side that wants it waits
    const imaging = k => st[k].run === 'run' && st[k].ph >= .3 && st[k].ph < .6, want = KEYS.filter(imaging);
    if (st.cam && !imaging(st.cam)) st.cam = null;                 // release the camera as soon as a side has its images
    if (!st.cam && want.length) st.cam = want[0];                  // first come, first served
    for (const k of KEYS) st[k].wait = want.includes(k) && st.cam !== k;
    if (st.cam) st.cyT = SIDE[st.cam].yc;                           // the carriage stays where it last imaged until the other side needs it
    st.cy += Math.max(-dt*28, Math.min(dt*28, st.cyT - st.cy)); if (Math.abs(st.cyT - st.cy) < .05) st.cy = st.cyT;
    const camReady = st.cam ? Math.abs(st.cy - SIDE[st.cam].yc) < .1 : false;
    for (const k of KEYS){ const S = st[k]; if (!ACTIVE(S)) continue; busy = true;
      if (S.run === 'hyb'){ S.ph += dt/2.2; if (S.ph >= 1){ S.run = 'rca'; S.ph = 0; ui.flash('Side ' + k + ': polony generation by rolling circle amplification', 2600); } continue; }
      if (S.run === 'rca'){ S.ph += dt/3.2; if (S.ph >= 1){ S.run = 'run'; S.ph = 0; ui.flash('Side ' + k + ': 300 cycles of sequencing by avidity begin', 2400); } continue; }
      if (S.run === 'turn'){ S.ph += dt/2.4; if (S.ph >= 1){ S.run = 'run'; S.ph = 0; } continue; }
      if (S.ph >= .3 && S.ph < .6 && (S.wait || !camReady)) continue;             // holds for the shared camera
      S.ph += dt/CYC;
      if (S.ph >= .6){ st.waste = Math.min(.95, st.waste + dt*.05); S.buf = Math.max(.1, S.buf - dt*.04); }
      if (S.ph >= 1){ S.ph = 0; S.cyc++;
        if (S.cyc >= NC){ S.run = 'done'; ui.flash('Side ' + k + ': run complete, 300 cycles', 2400); continue; }
        if (S.cyc === 3 || S.cyc === 7) ui.flash('Side ' + k + ': cycles ' + (S.cyc === 3 ? '4 to 149' : '154 to 299') + ' are not shown', 1600);
        if (S.cyc === 4){ S.run = 'turn'; ui.flash('Side ' + k + ': read 1 done at cycle 150, paired-end turn', 2400); } } }
    if (!busy && st.cy === st.cyT){ loopOn = false; return false; } return true; }); }
const mk = k => ({ k, fc:0, rc:0, fcT:0, rcT:0, door:0, busy:false, run:'idle', cyc:0, ph:0, wait:false, buf:.9 });

  fig:'22', turn:'full', title:'AVITI-style two-sided sequencer',

  buttons: [ ...KEYS.map(k => ({ label:'Side ' + k, choices: st => { const S = st[k]; return [

      { label:'Start run', disabled: !S.fc || !S.rc || ACTIVE(S), why: ACTIVE(S) ? 'Side ' + k + ' is running' : 'Load flow cell and reagents first', onClick: st => startRun(st[k]) },
      { label:'Unload', disabled: !S.fc && !S.rc, why: 'Nothing loaded', onClick: st => unload(st[k]) } ]; } })),
    { label:'Illumina sequencer', onClick: () => { location.href = 'sequencer-flowcell.html'; } },
    { label:'AVITI flow cell', onClick: () => { location.href = 'aviti-sequencing.html'; } },
    { label:'Library prep', onClick: () => { location.href = 'library-prep.html'; } },
    { label:'Cover', onClick: () => { location.href = 'index.html'; } } ],
  stats: st => KEYS.map(k => ({ label:'Side ' + k + (st[k].run === 'run' ? (st[k].cyc < 4 ? ' . read 1' : ' . read 2') : '') + ' . cycle', value: `${cycNo(st[k])}/${RLEN}`, small: true })),
  acts:{ fcA: st => loadFC(st.A), fcB: st => loadFC(st.B), rcA: st => loadRC(st.A), rcB: st => loadRC(st.B), doorA: st => st.A.fc ? unload(st.A) : loadFC(st.A), doorB: st => st.B.fc ? unload(st.B) : loadFC(st.B), screen: st => { startRun(st.A); } },
  params:(st, q) => { for (const k of KEYS){ const S = st[k]; if (q.get('fc' + k) === '1'){ S.fc = 1; S.fcT = 1; } if (q.get('rc' + k) === '1'){ S.rc = 1; S.rcT = 1; }
      for (const key of ['fcT', 'rcT', 'door', 'cyc', 'ph']) if (q.has(key + k)) S[key] = +q.get(key + k); if (q.has('run' + k)) S.run = q.get('run' + k); }
    if (q.has('cy')) st.cy = st.cyT = +q.get('cy'); if (q.has('cam')) st.cam = q.get('cam');
    if (KEYS.some(k => ACTIVE(st[k]))) setTimeout(runLoop, 0); },   // a run set up by URL runs
});
