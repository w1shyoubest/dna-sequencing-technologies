<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow cell close-up</title><style>.controls .ctl:nth-child(1),.controls .ctl:nth-child(2){display:none!important}</style></head><body>
<script src="core.js"></script>
<script>
/* Flow cell close-up: an eight-lane flow cell (6x life size); a patch of one lane's glass magnified to molecular scale;
   and the data the run leaves behind, as file cards along the front of the bench.

   SCALE OF THE MOLECULAR PATCH (one scale for everything on it)
     one bead = one nucleotide, 0.34 nm apart along a strand (B-DNA rise); the two strands of a duplex ~2 nm apart
     dNTP ~1 nm long: base + sugar + three phosphates
     DNA polymerase ~6 nm across (a ~70-90 kDa enzyme): it covers ~17 base pairs, far bigger than a dNTP
     lawn oligos ~5 nm apart. ONLY the strand length is not to scale: 30 nucleotides are drawn (4 adapter + 22 insert
     + 4 adapter, ~10 nm); real library strands are 300-600 nucleotides.

   HOW IT REALLY WORKS
   0. The lane floor carries a lawn of two short oligos, P5 and P7, fixed by their 5' ends (3' end up, free).
      A library fragment is double stranded: 5'-P5 . insert . P7'-3' paired with its complement.
   1. DENATURE: the two strands separate. Nothing is discarded: both single strands are flowed over the lane.
   2. HYBRIDIZE: strands diffuse and collide with lawn oligos at random. A 3' end that is not complementary falls off
      again; the top strand's 3' end (P7') stays on a P7 oligo, the bottom strand's 3' end (P5') on a P5 oligo.
      Each bound strand seeds its own cluster (the bottom strand's is left as a seed here).
   3. EXTEND: polymerase sits on the oligo's 3' end: its fingers close on the dNTP that matches the next template
      base (A-T, C-G), the palm joins it to the 3' end, pyrophosphate (two phosphates) leaves, the enzyme steps on.
      The copy is fixed to the glass (this is the FORWARD strand); the original template is washed away.
   4. BRIDGE AMPLIFICATION: the strand's free 3' end bends to a neighbouring oligo, polymerase copies the bridge,
      denaturing leaves a forward strand (on P7) and a REVERSE strand (on P5), complementary to each other.
      1 -> 2 -> 4 -> 8 are played; about 35 rounds really run, giving roughly 1000 copies = a cluster. BOTH library
      strands seed a cluster this way (cluster A from the top strand, cluster B from the bottom strand). A cluster must be full before sequencing: one molecule is too dim to see.
   5. LINEARIZE: reverse strands are cut off; a primer binds the free end of the forward strands.
   6. READ 1, sequencing by synthesis: per cycle polymerase adds ONE dNTP carrying a dye and a 3' block; the camera
      photographs the lane; dye and block are cleaved. 150 cycles (7 are played, then the last).
   7. INDEX READS: read 1 copy stripped; index 1 primer reads i7. Index 2 (forward-strand chemistry, MiSeq / NovaSeq
      6000 style): the strand's 3' end pairs with a surface P5 oligo, which is extended to read i5. (Other
      instruments read i5 after the turnaround with a primer.) Free 3' ends are blocked after each linearization
      and unblocked for the turnaround. In every SBS cycle unused dNTPs are washed out before imaging.
   8. PAIRED-END TURN: the strands bridge again and polymerase rebuilds the reverse strands; the forward strands
      are cut off; READ 2 is sequenced on the reverse strands.
   DATA  camera images -> base calls (one .bcl per cycle, with a quality score) -> demultiplexed by index ->
         FASTQ per library: R1 (read 1), R2 (read 2), and I1 (index read) when index files are written.

   PARTS  flow cell: carrier . glass . 4 lanes with imaging tiles . 4 inlet + 4 outlet ports . grip . barcode
          patch: glass . P5 / P7 oligos . library duplex . template . forward / reverse strands . polymerase
          (fingers, palm, thumb) . dNTPs (base, sugar, 3 phosphates) . pyrophosphate . primer . labelled blocked dNTPs
          data: camera image . base-call file . three FASTQ cards */
const BX = 174, BY = 156, SZ = 8, G = 1.6, CX = 164;       // CX: where the data cards stand                          // G: world units per molecular unit
const W = p => [44 + (p[0] - 44)*G, 30 + (p[1] - 20)*G, SZ + (p[2] - SZ)*G];   // molecular -> world
const KQ = Math.sqrt(1.5);
const NA = 4, AD = 9, NI = 14, NP = 3, N = AD + NI + AD, A1 = AD + NI, DZ = .9, RB = .5, DUP = 3;   // oligo beads; adapter beads per end; insert; primer; rise; bead radius; duplex width
const NM = DZ / .34;                                                // molecular units per nanometre
const BASES = 'ACGT', BCOL = ['#43c25c', '#4aa3ff', '#f4c430', '#e2483d'];
const P5 = '#17a398', P5c = '#9fe0d8', P7 = '#8a5cd6', P7c = '#cfbdf2', PRIM = '#55504a', PHOS = '#ff9f43', SUGAR = '#efe6cf';
const FWDC = '#2f6fbf', REVC = '#e07b1f', TPLC = '#8a8f94', TPL2 = '#c3c7ca';      // backbone colours: forward, reverse, library strands
const FCM = matOf('#56626d'), GLASS = matOf('#d9eef1'), PAPER = matOf('#fbfaf3');
const siteOf = (c, r) => [51 + 14*c, 27 + 14*r];
// two clusters: A grows from the top strand (on a P7 oligo), B from the bottom strand (on a P5 oligo); a free column between
const SA = [[3,1],[4,1],[3,2],[4,2],[3,0],[4,0],[3,3],[4,3]], SBs = SA.map(([c, r]) => [c - 3, r]), CLUSTERS = [SA, SBs];
let SITES = SA;
const isFwd = i => (SITES[i][0] + SITES[i][1]) % 2 === 0;           // P7 sites carry forward strands
const parentOf = i => i - (1 << Math.floor(Math.log2(i)));
const PAIR = [1, 0, 3, 2, 5, 4, 7, 6];                              // forward strand <-> the reverse site it bridges to
const FINS = Array.from({length:NI}, (_, i) => (i*7 + ((i*i) >> 1) + 3*(i % 5)) % 4);   // forward strand's insert
const comp = b => 3 - b;
// A library strand, 5' to 3' (top strand):  P5 . i5 index . read 1 primer site . INSERT . read 2 primer site' . i7' . P7'
// (real lengths 29 . 8 . 33 . ~300 . 34 . 8 . 24 nt; drawn 4 . 2 . 3 . 14 . 3 . 2 . 4). A prime = the complementary sequence, drawn paler.
const SEG = { P5:'#17a398', I5:'#e0409a', S1:'#2c3e7a', S2:'#6b7a3a', I7:'#9c6b30', P7:'#8a5cd6' }, lite = c => mix(c, '#ffffff', .55);
const segF = k => k < 4 ? SEG.P7 : k < 6 ? SEG.I7 : k < AD ? SEG.S2 : k < A1 ? null : k < A1 + 3 ? lite(SEG.S1) : k < A1 + 5 ? lite(SEG.I5) : lite(SEG.P5);
const segR = k => k < 4 ? SEG.P5 : k < 6 ? SEG.I5 : k < AD ? SEG.S1 : k < A1 ? null : k < A1 + 3 ? lite(SEG.S2) : k < A1 + 5 ? lite(SEG.I7) : lite(SEG.P7);
const segT = j => j < 4 ? lite(SEG.P7) : j < 6 ? lite(SEG.I7) : j < AD ? lite(SEG.S2) : j < A1 ? null : j < A1 + 3 ? SEG.S1 : j < A1 + 5 ? SEG.I5 : SEG.P5;
const FCOL = Array.from({length:N}, (_, k) => segF(k) || BCOL[FINS[k - AD]]);                    // forward strand, from its P7 oligo up
const RCOL = Array.from({length:N}, (_, k) => segR(k) || BCOL[comp(FINS[N - 1 - k - AD])]);      // reverse strand, from its P5 oligo up
const TCOL = Array.from({length:N}, (_, j) => segT(j) || BCOL[comp(FINS[j - AD])]);              // library top strand, from its 3' end (P7')
const BCOLS = Array.from({length:N}, (_, j) => FCOL[N - 1 - j]);                                  // library bottom strand, from its 3' end (P5')
const READ = Array.from({length:NI}, (_, c) => comp(FINS[NI - 1 - c]));   // read 1, on the forward strand
const READ2 = FINS.slice();                                              // read 2, on the reverse strand
const IDXS = 'ATCACG', IDX2S = 'GCTTAG', RLEN = 150, SHOWN = 8;
const CY = [126.4, 102, 77.6, 53.2, 28.8, 4.4];                      // data cards, left to right
const cycNo = n => n < SHOWN ? n : RLEN;                            // cycles 1..7 are played, then the last one
const posOf = n => n >= SHOWN ? NI : n;                             // how many read beads exist after n shown cycles
const rdStr = (R, n) => { const r = R.slice(0, Math.min(n, SHOWN - 1)).map(b => BASES[b]).join(''); return n >= SHOWN ? r + '..' + BASES[R[NI - 1]] : r; };
const POOL = [[48,26,36],[62,84,40],[108,30,38],[110,74,35],[78,56,43],[92,86,41],[70,23,42],[100,50,44],[80,36,45],[56,60,38]];

const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t), c01 = v => Math.max(0, Math.min(1, v));
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mu = w => `style="stroke-width:${w.toFixed(2)}"`;
const bead = (p, r, col, w = .5, sc = INK) => { const q = P(...W(p)); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*KQ*G)}" fill="${col}" stroke="${sc}" stroke-width="${w}"/>`; };
const ring = (p, r, col, wd = .5, op = 1) => { const q = P(...W(p)); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*KQ*G)}" fill="none" stroke="${col}" ${mu(wd)} opacity="${f(op)}"/>`; };
const halo = (p, r, col, op) => { const q = P(...W(p)); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*KQ*G)}" fill="${col}" opacity="${op.toFixed(2)}"/>`; };
const note = (p, str, col = INK, size = 3) => { const q = P(...W(p)); return `<text x="${f(q[0])}" y="${f(q[1])}" font-size="${size}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${col}" stroke="#f2efe7" style="stroke-width:.9;paint-order:stroke">${str}</text>`; };
// a strand: a coloured backbone (which strand it is), then its beads (the bases) from far to near
function chain(pts, cols, n = pts.length, rib = PRIM){
  if (n < 1) return ''; const pp = pts.slice(0, n), d = pd(pp.map(W), false);
  const s = n > 1 ? `<path d="${d}" fill="none" stroke="${INK}" ${mu(1.75)} stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${rib}" ${mu(1.25)} stroke-linecap="round" stroke-linejoin="round"/>` : '';
  return s + pp.map((p, i) => [depthOf(W(p)), bead(p, RB, cols[i], 1.1, rib)]).sort((a, b) => a[0] - b[0]).map(x => x[1]).join('');
}
const rungs = (A, B, n) => { let d = ''; for (let i = 0; i < n; i++) if (A[i] && B[i]) d += pd([W(A[i]), W(B[i])], false);
  return d ? `<path d="${d}" fill="none" stroke="${INK}" ${mu(.3)} opacity=".6"/>` : ''; };
// the fluorophore (~1 nm, as big as the nucleotide): a star in the base's colour; lit = glowing
const star = (p, r, col, lit = 0) => { const q = P(...W(p)), R = r*KQ*G; let d = '';
  for (let i = 0; i < 16; i++){ const a = i*Math.PI/8, rr = i % 2 ? R*.5 : R; d += (i ? 'L' : 'M') + f(q[0] + rr*Math.sin(a)) + ' ' + f(q[1] - rr*Math.cos(a)); }
  return (lit > 0 ? `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R*2.3)}" fill="${col}" opacity="${(.5*lit).toFixed(2)}"/>` : '')
    + `<path d="${d}Z" fill="${col}" stroke="${INK}" stroke-width=".5" stroke-linejoin="round"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R*.28)}" fill="#ffffff"/>`; };
// the 3' block: a dark cap on the sugar's 3' position, where the next nucleotide would have to attach
const cap = (p, r = .34) => { const q = P(...W(p)), R = r*KQ*G; return `<rect x="${f(q[0] - R)}" y="${f(q[1] - R)}" width="${f(2*R)}" height="${f(2*R)}" rx="${f(R*.25)}" fill="${INK}"/><path d="M${f(q[0] - R*.5)} ${f(q[1])}L${f(q[0] + R*.5)} ${f(q[1])}" stroke="#f2efe7" ${mu(.3)}/>`; };
// a free dNTP, ~1 nm: base (coloured) + sugar + three phosphates; labelled = dye on the base and a block on the sugar's 3' end
const dparts = p => ({ sugar: add(p, [0, -.72, -.2]), ph: [0, 1, 2].map(i => add(p, [0, -1.25 - .48*i, -.35 - .12*i])), dye: add(p, [0, 1.5, 1.3]), block: add(p, [0, -.72, .55]) });
function dntp(p, col, labelled){ const q = dparts(p);
  let s = `<path d="${pd([W(p), W(q.sugar), ...q.ph.map(W)], false)}" fill="none" stroke="${INK}" ${mu(.35)}/>` + q.ph.slice().reverse().map(x => bead(x, .25, PHOS, .35)).join('') + bead(q.sugar, .32, SUGAR, .35);
  if (labelled) s += `<path d="${pd([W(p), W(q.dye)], false)}" fill="none" stroke="${INK}" ${mu(.4)}/>` + star(q.dye, 1.15, col);
  s += bead(p, RB, col);
  if (labelled) s += cap(q.block);
  return s; }
// DNA polymerase, ~6 nm: palm (active site at the 3' end), fingers (close on the dNTP) and thumb (holds the duplex)
const PR = 7.5;
const polyAt = (p, a, b) => { const c = W(p), R = PR*G; return [0, 1, 2].map(i => c[i] + CAM_R[i]*a*R + CAM_U[i]*b*R); };
// a plain rounded clamp: one thick C closed round the duplex, open toward the single-stranded template ahead of it.
// The two tips are the fingers and thumb, the closed back is the palm, the dot in the middle is the active site.
function polymerase(p, m, flip = 1){ const R = PR*G*KQ, pts = [];
  for (let i = 0; i <= 32; i++){ const t = (48 + 264*i/32)*Math.PI/180; pts.push(P(...polyAt(p, .58*Math.sin(t), .58*Math.cos(t)*flip))); }
  const d = 'M' + pts.map(q => f(q[0]) + ' ' + f(q[1])).join('L'), c = P(...polyAt(p, 0, 0));
  const st = (col, w, extra = '') => `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${(w*R).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  return `<g opacity=".8">${st(INK, .56)}${st(m.m, .5)}${st(m.l, .2, 'opacity=".7"')}</g><circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(.08*R)}" fill="${m.d}" opacity=".8"/>`; }

/* ---------- shapes of an N-bead strand (molecular units) ---------- */
const sway = (i, ph) => [1.2*(i/(N - 1))*Math.sin(i*.26 + ph), 1.2*(i/(N - 1))*Math.cos(i*.2 + ph*1.7)];
const stand = (s, i, ph = 0) => { const w = sway(i, ph); return [s[0] + w[0], s[1] + w[1], SZ + 1 + DZ*i]; };
const perpOf = (a, b) => { const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [-(b[1] - a[1])/d*DUP, (b[0] - a[0])/d*DUP, 0]; };
const arch = (a, b, i) => { const t = i/(N - 1), e = (1 - Math.cos(Math.PI*t))/2, pp = perpOf(a, b), tx0 = b[0] - pp[0], ty0 = b[1] - pp[1];
  return [a[0] + (tx0 - a[0])*e, a[1] + (ty0 - a[1])*e, SZ + 1 + 10.4*Math.sin(Math.PI*t)]; };
const archKid = (a, b, k) => k < NA ? stand(b, k) : add(arch(a, b, N - 1 - k), perpOf(a, b));
const OFF = [DUP, 0, 0];
const libT = j => [76, 40 + DZ*j, 44], libC = j => [76 + DUP, 40 + DZ*j, 44];
const IDX = Array.from({length:N}, (_, k) => k);

/* ---------- the flow cell, 6x: four lanes ---------- */
const FX = 6, FY = 70, FG = 6, NL = 8, LW = .3, laneU = i => .55 + i*.4;      // eight lanes (the classic HiSeq layout)
function flowCell(st){
  const z0 = 2, z1 = 5.6, zt = z1 + .04, g = FG;
  const R = (u0, v0, u1, v1, dz = 0) => [[FX + u0*g, FY + v0*g, zt + dz], [FX + u1*g, FY + v0*g, zt + dz], [FX + u1*g, FY + v1*g, zt + dz], [FX + u0*g, FY + v1*g, zt + dz]];
  const flowing = st.anim === 'amp' || st.anim === 'ext' || st.anim === 'turn';
  let s = box(FX, FY, z0, FX + 4.2*g, FY + 11*g, z1, FCM, toneI, 1.2);
  s += shape(R(.45, 1.9, 3.75, 9.1), CLEAR.l, .9);
  let ticks = '';
  for (let i = 0; i < NL; i++){ const u = laneU(i);
    s += shape(R(u, 2.15, u + LW, 8.85, .01), flowing ? '#ffd3e4' : '#cdeef4', .6);
    for (let v = 2.7; v < 8.8; v += .56) ticks += pd([[FX + u*g, FY + v*g, zt + .02], [FX + (u + LW)*g, FY + v*g, zt + .02]], false);       // imaging tiles
    for (const v of [1.35, 9.65]) s += shape(on(PZ(zt), ellUV(FX + (u + LW/2)*g, FY + v*g, .78, .78, 10)), METAL.l, .5) + shape(on(PZ(zt), ellUV(FX + (u + LW/2)*g, FY + v*g, .34, .34, 8)), '#2b2523', .3);
    s += `<text transform="${txM(P(FX + (u + LW/2)*g, FY + 10.22*g, zt), Dv(0,-1,0), Dv(1,0,0))}" font-size="1.6" fill="#f2efe7" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${i + 1}</text>`; }
  s += `<path d="${ticks}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".35"/>`;
  for (const v of [.3, .6, .9]) s += fill(pd(R(.9, v, 3.3, v + .1)), FCM.d);
  for (let k = 0; k < 9; k++) s += fill(pd(R(3.86, 4.2 + k*.3, 4.08, 4.2 + k*.3 + (k % 3 ? .1 : .18))), '#f2efe7');      // barcode on the carrier edge
  // clusters: they appear with amplification and light up base by base
  const RD = st.read === 2 ? READ2 : READ, nC = st.lib < 3 ? 0 : 120, cyc = st.seq, glow = st.anim === 'sbs' && st.u > .4 && st.u < .75;
  const bi = cyc > 0 ? RD[posOf(cyc) - 1] : 0;
  for (let i = 0; i < nC; i++){ const u = laneU(i % NL) + .04 + (i*37 % 13)/13*.22, v = 2.4 + (i*53 % 17)/17*6.2, rr = .14 + .07*st.rounds;
    s += fill(pd(on(PZ(zt + .03), ellUV(FX + u*g, FY + v*g, rr, rr, 6))), cyc > 0 ? BCOL[(bi + i*i + (i >> 1)*cyc) % 4] : '#ffffff', cyc > 0 && !glow ? 'opacity=".55"' : ''); }
  // the spot that is magnified (on lane 2), and the zoom lines to the patch
  const sx = FX + (laneU(3) + LW/2)*g, sy = FY + 5.5*g;
  s += ink(pd(on(PZ(zt + .04), rectUV(sx - .9, sy - .9, sx + .9, sy + .9))), 1.1);
  if (st.lib >= 3) s += fill(pd(on(PZ(zt + .04), ellUV(sx, sy, .5, .5, 8))), cyc > 0 ? BCOL[bi] : '#ffffff');
  s += `<path d="${pd([[sx + 1, sy - 1, zt], [44, 30, SZ]], false)}${pd([[sx + 1, sy + 1, zt], [44, 142, SZ]], false)}" fill="none" stroke="${INK}" stroke-width="1" stroke-dasharray="${f(3*INK_K)} ${f(3*INK_K)}" opacity=".7"/>`;
  return s;
}

/* ---------- the data: camera image -> base calls -> FASTQ files for this library ---------- */
const nRead = (st, r) => r === 1 ? (st.read === 2 || st.idx > 0 ? SHOWN : st.seq < 1 ? 0 : st.anim === 'sbs' && st.u < .4 ? st.seq - 1 : st.seq)
  : (st.read < 2 || st.seq < 1 ? 0 : st.anim === 'sbs' && st.u < .4 ? st.seq - 1 : st.seq);
const nIdx = st => st.anim === 'idx' ? Math.floor(c01((st.u - .35)/.6)*6 + .001) : st.idx;
const nIdx2 = st => st.anim === 'idx2' ? (st.u > .5 ? 6 : st.u > .36 ? 3 : 0) : st.idx2;
function card(y0, title, lines, hot, extra = ''){
  const x0 = CX, x1 = CX + 1.2, z0 = 2, z1 = 26, w = 22;
  let s = box(x0, y0, z0, x1, y0 + w, z1, PAPER, toneI, 1.1);
  if (facing([1,0,0])){ const X = x1 + .06;
    s += shape(on(PX(X - .02), rectUV(y0 + .3, z1 - 4.4, y0 + w - .3, z1 - .3)), hot ? 'var(--accent,#f3a6bb)' : '#3d3935', .6);
    s += tx(X, y0 + w/2, z1 - 3.1, title, 1.7, hot ? INK : '#f6f2e6', 800);
    lines.forEach((ln, i) => { if (ln) s += tx(X, y0 + w/2, z1 - 7.6 - 3.1*i, ln[0], ln[2] || 1.45, ln[1] || INK, 700); });
    s += extra; }
  return s;
}
function dataCards(st){
  const sbs = st.anim === 'sbs', im = sbs && st.u >= .4 && st.u < .75, RD = st.read === 2 ? READ2 : READ, cyc = st.seq;
  const n1 = nRead(st, 1), n2 = nRead(st, 2), ni = nIdx(st), q = n => 'F'.repeat(Math.min(n, SHOWN - 1)) + (n >= SHOWN ? '..F' : '');
  const X = CX + 1.3, bi = cyc > 0 ? RD[posOf(cyc) - 1] : 0;
  let dots = '';
  if (facing([1,0,0])) for (let i = 0; i < 18; i++){ const y = CY[0] + 19.2 - (i % 6)*3.3, z = 15.6 - ((i / 6) | 0)*3.6;
    const col = st.lib < 3 ? '#33423c' : cyc > 0 ? BCOL[(bi + i*i + (i >> 1)*cyc) % 4] : '#dfeee6';
    dots += fill(pd(on(PX(X), ellUV(y, z, 1.0, 1.0, 10))), col, cyc > 0 && !im ? 'opacity=".5"' : ''); }
  const img = card(CY[0], 'CAMERA IMAGE', [null, null, null, null, [cyc > 0 ? `READ ${st.read} CYCLE ${cycNo(cyc)}` : st.lib >= 3 ? 'CLUSTERS, NOT LIT' : 'NO CLUSTERS YET', '#857d6e', 1.3]], im,
    (facing([1,0,0]) ? fill(pd(on(PX(CX + 1.27), rectUV(CY[0] + 1.6, 5.6, CY[0] + 20.4, 20.4))), '#1d2a26') : '') + dots);
  const calls = []; for (let k = Math.max(1, cyc - 2); k <= cyc; k++) calls.push([`CYCLE ${String(cycNo(k)).padStart(3, ' ')}  ${BASES[RD[posOf(k) - 1]]}  Q${36 + (k*7) % 4}`]);
  while (calls.length < 3) calls.push(null);
  const bcl = card(CY[1], 'BASE CALLS .bcl', [...calls, ['BASE + PHRED QUALITY', '#857d6e', 1.25], ['PHASING FIXED, BAD', '#857d6e', 1.25], ['CLUSTERS FILTERED OUT', '#857d6e', 1.25]], sbs && st.u >= .75);

  s += byDepth([{ box: [[FX, FY, 2], [FX + 25.2, FY + 66, 6]], svg: flowCell(st) }, { box: [[44, 30, 2], [162, 142, 70]], svg: micro(st, m) }, ...dataCards(st)]);
  const g = FG;
  s += xrCallouts([{ at: [FX + (laneU(0) + LW/2)*g, FY + 8*g, 5.7], text: 'LANES 1 TO 8', on: !!st.anim }, { at: [FX + (laneU(7) + LW/2)*g, FY + 4.1*g, 5.7], text: 'IMAGING TILE', on: st.anim === 'sbs' },
    { at: [FX + (laneU(7) + LW/2)*g, FY + 9.65*g, 5.7], text: 'INLET PORTS', on: false }, { at: [FX + (laneU(7) + LW/2)*g, FY + 1.35*g, 5.7], text: 'OUTLET PORTS', on: false },
    
    ...(facing([1,0,0]) ? [{ at: [CX + 1.3, CY[1] - 1.2, 22], text: 'DEMULTIPLEX BY INDEX', on: st.seq >= SHOWN }, { at: [CX + 1.3, CY[3] + 11, 26], text: 'FASTQ FILES PER LIBRARY', on: st.seq >= SHOWN }, { at: [CX + 1.3, CY[5] + 4, 26], text: 'NEXT: QC, TRIM, ALIGN', on: st.read === 2 && st.seq >= SHOWN }] : []),
    ...CF_LABELS], [66, 134, 56, 116, 0, 40]);
  return s;
}

/* ---------- behaviour ---------- */
let ui;
function play(st, name, secs, note2, then){ st.anim = name; st.u = 0; if (note2) ui.flash(note2, 3400);
  ui.animate(dt => { st.u = Math.min(1, st.u + dt/secs); if (st.u >= 1){ st.anim = null; if (then) then(); return false; } return true; }); }
const busy = st => st.anim ? (ui.flash('One moment'), true) : false;
function denature(st){ if (busy(st)) return; if (st.lib > 0) return ui.flash('Already single strands');
  st.lib = 1; play(st, 'den', 2, 'NaOH pulls the two strands apart; BOTH are flowed onto the flow cell'); }
function hybridize(st){ if (busy(st)) return; if (st.lib < 1) return ui.flash('Denature the library first'); if (st.lib > 1) return ui.flash('Already bound to the lawn');
  st.lib = 2; play(st, 'hyb', 8, 'Strands drift and bump into oligos at random; only a complementary 3 end sticks'); }
function extend(st){ if (busy(st)) return; if (st.lib < 2) return ui.flash('Hybridize a strand first'); if (st.lib > 2) return ui.flash('The first copy is made');
  st.lib = 3; play(st, 'ext', 9, 'Polymerase grips the matching dNTP and joins it to the 3 end; two phosphates leave');
  let told = false; ui.animate(() => { if (st.anim !== 'ext') return false; if (st.u > .72 && !told){ told = true; ui.flash('The original library strands are washed away; only the fixed copies stay', 3200); } return true; }); }
function amplify(st){ if (busy(st)) return; if (st.lib < 3) return ui.flash('Make the first copy first: Extend');
  if (st.seq >= 0) return ui.flash('The strands are linearized already'); if (st.rounds >= 3) return ui.flash('The cluster is full: sequence it');
  st.rounds++; play(st, 'amp', 6, st.rounds < 3 ? 'Each strand bridges to a free oligo; polymerase copies it: forward makes reverse, reverse makes forward' : 'Round 3. Rounds 4 to about 35 are not shown: each cluster ends with about 1000 copies'); }
// Sequence runs a whole read; if the cluster is not full yet it finishes the bridge amplification first
function sequence(st, auto){ if (!auto && busy(st)) return; if (st.lib < 3) return ui.flash('Make the first copy first: Extend');
  const again = () => sequence(st, true);
  if (st.rounds < 3){ st.rounds++; return play(st, 'amp', 5, st.rounds < 3 ? 'First the clusters: bridge amplification, round ' + st.rounds : 'Round 3. Rounds 4 to about 35 are not shown: about 1000 copies per cluster', again); }
  if (st.seq < 0){ st.seq = 0; return play(st, 'lin', 2.6, st.read === 2 ? 'Forward strands are cut off, 3 ends blocked; primer 2 binds the reverse strands' : 'Reverse strands are cut off, free 3 ends are blocked; primer 1 binds', again); }
  if (st.seq >= SHOWN){ if (st.read === 2) return ui.flash('Both reads are complete: FASTQ files for this library');
    if (!st.idx){ st.idx = 6; return play(st, 'idx', 3.4, 'Index 1 read: read 1 copy is stripped; an index primer reads the i7 barcode', again); }
    if (!st.idx2){ st.idx2 = 6; return play(st, 'idx2', 4.4, 'Index 2 read: the strand end bends to a P5 oligo, which is extended to read i5'); }
    return ui.flash('Read 1 and both index reads are done: Turn around for read 2'); }
  st.seq++; play(st, 'sbs', 2.1, st.seq === 1 ? 'Polymerase adds ONE dNTP with a dye and a 3 block; the camera reads the colour' : st.seq === 2 ? 'Every cycle: add one base, wash, image, cleave dye and block' : st.seq === SHOWN ? 'Cycles 8 to 149 are not shown: a real read is 150 cycles' : '', again); }
function turnAround(st){ if (busy(st)) return; if (st.read === 2) return ui.flash('Already turned around: Sequence read 2');
  if (st.seq < SHOWN || !st.idx2) return ui.flash('Finish read 1 and the index reads first: Sequence');
  st.read = 2; st.seq = -1; play(st, 'turn', 7, '3 ends are unblocked; the forward strands bridge again and polymerase rebuilds the reverse strands'); }
function resetAll(st){ if (busy(st)) return; st.lib = 0; st.rounds = 0; st.seq = -1; st.u = 0; st.read = 1; st.idx = 0; st.idx2 = 0; }

ui = mountFigure({
  fig:'13', turn:'full', title:'Flow cell close-up',
  size:[BX, BY, 62], palette:'blush',
  state:{ lib:0, rounds:0, seq:-1, read:1, idx:0, idx2:0, anim:null, u:0 },
  scene,
  buttons:[
    { label:'Denature', onClick: st => denature(st) },
    { label:'Hybridize', onClick: st => hybridize(st) },
    { label:'Extend', onClick: st => extend(st) },
    { label:'Bridge amplify', onClick: st => amplify(st) },
    { label:'Sequence', onClick: st => sequence(st) },
    { label:'Turn around', onClick: st => turnAround(st) },
    { label:'Reset', onClick: st => resetAll(st) },
    { label:'Next: Illumina sequencer', onClick: () => { location.href = 'sequencer.html'; } },
    { label:'AVITI flow cell', onClick: () => { location.href = '../aviti/flow-cell.html'; } },
    { label:'Library prep', onClick: () => { location.href = '../library-prep.html'; } },
    { label:'Cover', onClick: () => { location.href = '../../index.html'; } },
  ],
  stats: st => [
    { label:`Read ${st.read} cycle`, value: `${st.seq < 1 ? 0 : cycNo(st.seq)}/${RLEN}` },
    { label:'Copies per cluster', small:true, value: st.lib < 3 ? 0 : st.rounds >= 3 && st.anim !== 'amp' ? '~1000 (8 drawn)' : 1 << st.rounds },
    { label:'Clusters here', small:true, value: st.lib < 3 ? 0 : 2 },
    { label:'Read 1', value: rdStr(READ, nRead(st, 1)) || '-', small:true }, { label:'Index 1 + 2', value: (IDXS.slice(0, nIdx(st)) || '-') + ' ' + (IDX2S.slice(0, nIdx2(st)) || '-'), small:true }, { label:'Read 2', value: rdStr(READ2, nRead(st, 2)) || '-', small:true } ],
  params:(st, q) => { for (const key of ['lib', 'rounds', 'seq', 'u', 'read', 'idx', 'idx2']) if (q.has(key)) st[key] = +q.get(key); if (q.has('anim')) st.anim = q.get('anim'); },
});
xrMount(() => ui, () => '', { labelsOnly:true });
</script></body></html>
