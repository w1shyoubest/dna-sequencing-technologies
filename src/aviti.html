<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVITI: rolling circle amplification and sequencing by avidity</title>
<style>.controls .ctl:nth-child(1),.controls .ctl:nth-child(2){display:none!important}</style></head><body>
<script src="core.js"></script>
<script>
/* Reference: Arslan et al., Sequencing by avidity enables high accuracy with low reagent consumption,
   Nat Biotechnol 42, 132 (2024), doi 10.1038/s41587-023-01750-7. From the paper: libraries are circularized BEFORE
   loading (in a tube), denatured, diluted to 8 pM and hybridized to the flow cell (5 min, 50 C); RCA runs on the
   instrument and gives ~1 billion polonies per flow cell (the RCA enzyme is not named); avidite = dye-labelled
   streptavidin core with biotin-linked arms (about three nucleotide arms per core, cores linked by 4-arm PEG);
   binding uses an engineered archaeal polymerase, stepping a second polymerase evolved for unlabelled 3'-blocked
   nucleotides; four colours; reads shown 2 x 150 and 1 x 300.
   Element AVITI, the big picture: a patch of flow cell surface at molecular scale (schematic: a library circle of a
   few hundred nucleotides is drawn as 24 beads, a polony of many tandem copies as 6).

   HOW IT REALLY WORKS
   1. CIRCULARIZE: the single-stranded library's two ends are brought together on a splint oligo and joined by a
      ligase: a closed single-stranded circle.
   2. HYBRIDIZE: the circle pairs with a primer fixed on the flow cell surface.
   3. ROLLING CIRCLE AMPLIFICATION: a strand-displacing polymerase extends that primer round and round the circle.
      Each lap pushes the previous lap off, so one long single strand grows: tandem copies of the circle's complement,
      fixed to the glass at its 5' end. It folds into a compact ball, a polony. Every copy is read off the ORIGINAL
      circle, so a copying error is not passed on to later copies (unlike PCR / bridge amplification).
   4. PRIME: a sequencing primer pairs with the same site in every copy.
   5. SEQUENCING BY AVIDITY, per cycle:
      a BIND    a polymerase sits on each primed site; avidites flow in. An avidite is a core carrying dyes and many
                arms that all end in the same nucleotide. Its arms bind many polymerase-template sites of one polony
                at once (avidity), so it holds on long enough to image at very low concentration. Nothing is joined.
      b IMAGE   the dye colour of the bound avidite tells the next base.
      c REMOVE  avidites and polymerases are washed off.
      d STEP    an unlabelled nucleotide with a 3' block is incorporated: the strand advances exactly one base.
      e UNBLOCK the 3' block is removed. Repeat.

   PARTS  flow cell: carrier . glass . 2 lanes . ports  |  patch: glass . surface primers . library strand . splint .
          circle . polymerase (clamp) . dNTPs . concatemer (polony) . sequencing primers . avidites (core, dyes,
          arms, nucleotides) . blocked nucleotides */
const BX = 148, BY = 134, RLEN = 300, cycNo = k => k < NCYC ? k : RLEN, NBR = [[5, 29, 5], [23, 6, 9]],
  rdStr = k => { const r = READ.slice(0, Math.min(k, NCYC - 1)).map(b => BASES[b]).join(''); return k >= NCYC ? r + '..' + BASES[READ[NCYC - 1]] : r; }, SZ = 8, G = 2.8, KQ = Math.sqrt(1.5);
const W = p => [52 + p[0]*G, 16 + p[1]*G, SZ + p[2]*G];             // molecular -> world (glass top at z = 0)
const LN = 24, RB = .55, RC0 = LN*1.5/(2*Math.PI), ROUT = RC0 + 1.4, NT = 6*LN + 6, LAG = 18, NCYC = 6;
const BASES = 'ACGT', BCOL = ['#43c25c', '#4aa3ff', '#f4c430', '#e2483d'], lite = c => mix(c, '#ffffff', .55);
const PRM = '#8a5cd6', SPS = '#2c3e7a', PRIM = '#55504a', PHOS = '#ff9f43', SUGAR = '#efe6cf', TPLC = '#8a8f94', FWDC = '#2f6fbf', SPL = '#b08968';
const FCM = matOf('#56626d'), GLASS = matOf('#d9eef1');
const INS = Array.from({length:14}, (_, i) => (i*7 + ((i*i) >> 1) + 3*(i % 5)) % 4);
const PC = m => m < 6 ? PRM : m < 20 ? BCOL[INS[m - 6]] : SPS;                 // product (concatemer) bead colours, per copy
const CC = q => q < 6 ? lite(PRM) : q < 20 ? BCOL[3 - INS[q - 6]] : lite(SPS);  // circle = its complement
const READ = Array.from({length:NCYC}, (_, k) => 3 - INS[13 - k]);               // base read in cycle k + 1
const ST0 = [14, 17], POOL = [[4, 31, 17], [24, 32, 20], [25, 4, 19], [4, 3, 21]];
const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t), c01 = v => Math.max(0, Math.min(1, v)), add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mu = w => `style="stroke-width:${w.toFixed(2)}"`;
const bead = (p, r, col, w = .5, sc = INK) => { const q = P(...W(p)); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*KQ*G)}" fill="${col}" stroke="${sc}" stroke-width="${w}"/>`; };
const halo = (p, r, col, op) => { const q = P(...W(p)); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*KQ*G)}" fill="${col}" opacity="${op.toFixed(2)}"/>`; };
const note = (p, str, col = INK, size = 3) => { const q = P(...W(p)); return `<text x="${f(q[0])}" y="${f(q[1])}" font-size="${size}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${col}" stroke="#f2efe7" style="stroke-width:.9;paint-order:stroke">${str}</text>`; };
const seg = (pts, col, w, op = 1) => `<path d="${pd(pts.map(W), false)}" fill="none" stroke="${col}" ${mu(w)} stroke-linecap="round" stroke-linejoin="round" opacity="${f(op)}"/>`;
function chain(pts, cols, rib = PRIM, closed = false){
  if (!pts.length) return ''; const d = pd(pts.map(W), closed);
  const s = pts.length > 1 ? `<path d="${d}" fill="none" stroke="${INK}" ${mu(1.6)} stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${rib}" ${mu(1.1)} stroke-linecap="round" stroke-linejoin="round"/>` : '';
  return s + pts.map((p, i) => [depthOf(W(p)), bead(p, RB, cols[i], 1, rib)]).sort((a, b) => a[0] - b[0]).map(x => x[1]).join('');
}
const rungs = (A, B) => { let d = ''; for (let i = 0; i < Math.min(A.length, B.length); i++) d += pd([W(A[i]), W(B[i])], false); return d ? `<path d="${d}" fill="none" stroke="${INK}" ${mu(.3)} opacity=".6"/>` : ''; };
const star = (p, r, col, lit = 0) => { const q = P(...W(p)), R = r*KQ*G; let d = '';
  for (let i = 0; i < 16; i++){ const a = i*Math.PI/8, rr = i % 2 ? R*.5 : R; d += (i ? 'L' : 'M') + f(q[0] + rr*Math.sin(a)) + ' ' + f(q[1] - rr*Math.cos(a)); }
  return (lit > 0 ? `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R*2.2)}" fill="${col}" opacity="${(.45*lit).toFixed(2)}"/>` : '') + `<path d="${d}Z" fill="${col}" stroke="${INK}" stroke-width=".5" stroke-linejoin="round"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R*.28)}" fill="#ffffff"/>`; };
const cap = (p, r = .34) => { const q = P(...W(p)), R = r*KQ*G; return `<rect x="${f(q[0] - R)}" y="${f(q[1] - R)}" width="${f(2*R)}" height="${f(2*R)}" rx="${f(R*.25)}" fill="${INK}"/>`; };
const dntp = (p, col) => seg([p, add(p, [0, -.75, -.2]), add(p, [0, -2.2, -.55])], INK, .35) + [2, 1, 0].map(i => bead(add(p, [0, -1.25 - .48*i, -.35 - .12*i]), .25, PHOS, .35)).join('') + bead(add(p, [0, -.72, -.2]), .32, SUGAR, .35) + bead(p, RB, col);
// polymerase: a plain rounded clamp round the strand it works on
function clamp(p, m, R = 3.4, op = .8){ const c = W(p), pts = [];
  for (let i = 0; i <= 24; i++){ const t = (48 + 264*i/24)*Math.PI/180; pts.push(P(...[0, 1, 2].map(j => c[j] + CAM_R[j]*R*G*.58*Math.sin(t) + CAM_U[j]*R*G*.58*Math.cos(t)))); }
  const d = 'M' + pts.map(q => f(q[0]) + ' ' + f(q[1])).join('L'), st = (col, w) => `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${(w*R*G*KQ).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<g opacity="${f(op)}">${st(INK, .56)}${st(m.m, .5)}${st(m.l, .2)}</g>`; }
// avidite: a core with dyes, and arms that all end in the same nucleotide
function avidite(core, ends, col, lit, op = 1){
  let s = ends.map(e => seg([core, e], INK, .5) + seg([core, e], '#f6f2e6', .25)).join('');
  s += ends.map(e => [depthOf(W(e)), bead(e, RB*1.05, col, .6)]).sort((a, b) => a[0] - b[0]).map(x => x[1]).join('');
  s += bead(core, 1.7, '#f6f2e6', 1.3) + [[-.9, 0, .9], [.9, 0, .7], [0, 0, -.9]].map(o => star(add(core, o), .95, col, lit)).join('');
  return `<g opacity="${f(op)}">${s}</g>`; }
const freeEnds = core => [0, 1, 2, 3, 4].map(i => add(core, [2.6*Math.cos(i*1.257), 2.6*Math.sin(i*1.257), -2.4 + .5*(i % 2)]));

/* ---------- geometry of the circle, the ring of fresh product on it, and the ball of displaced product ---------- */
const th = m => (-90 + (m - 2.5)*15)*Math.PI/180;
const ballR = D => D > 0 ? Math.max(.7, .38*Math.sqrt(D)) : 0, ballC = D => [ST0[0], ST0[1], 1.2 + ballR(D)];
const ringC = (D, t = 0) => [ST0[0], ST0[1], 1.2 + 2*ballR(D) + ROUT + (D ? .8 : 0) - t*(ballR(D) + ROUT - .4)];   // t = 1: settled inside the ball
const onRing = (C, m, rr) => [C[0], C[1] + rr*Math.cos(th(m)), C[2] + rr*Math.sin(th(m))];
const ballPos = (i, D) => { const R = ballR(D), B = ballC(D), T = Math.PI*R/1.7, t = (i + .5)/D, ph = -Math.PI/2 + Math.PI*t, la = 2*Math.PI*T*t;
  return [B[0] + R*Math.cos(ph)*Math.cos(la), B[1] + R*Math.cos(ph)*Math.sin(la), B[2] + R*Math.sin(ph)]; };
const outOf = (p, D, k = 1.35) => { const B = ballC(D), d = norm(sub(p, B)); return add(p, d.map(v => v*k)); };
const DFIN = NT - LAG, SITES = [0, 1, 2, 3, 4];                      // displaced beads at the end; copies that get a sequencing primer
const tplAt = (c, m) => ballPos(c*LN + m, DFIN);

/* ---------- the flow cell: carrier, glass, two lanes of imaging tiles, a port at each lane end, barcode ---------- */
function flowCell(st){
  const x0 = 8, y0 = 32, z1 = 5.2, zt = z1 + .04, R = (a, b, c, d, dz = 0) => [[x0 + a, y0 + b, zt + dz], [x0 + c, y0 + b, zt + dz], [x0 + c, y0 + d, zt + dz], [x0 + a, y0 + d, zt + dz]];
  const wet = st.anim === 'rca' || st.anim === 'hyb', im = st.anim === 'seq' && st.u >= .3 && st.u < .6, k = st.cyc, lane = i => 4.2 + i*12.2, LW = 10;
  let s = box(x0, y0, 2, x0 + 30, y0 + 66, z1, FCM, toneI, 1.2) + shape(R(3, 6, 27, 60), CLEAR.l, .9), ticks = '';
  for (let i = 0; i < 2; i++){ const a = lane(i);
    s += shape(R(a, 9, a + LW, 57, .01), wet ? '#ffe0c2' : '#cdeef4', 1.1);
    for (let b = 13.5; b < 57; b += 4.5) ticks += pd([[x0 + a, y0 + b, zt + .02], [x0 + a + LW, y0 + b, zt + .02]], false);
    s += `<text transform="${txM(P(x0 + a + LW/2, y0 + 33, zt + .02), Dv(0,-1,0), Dv(1,0,0))}" font-size="3.2" fill="${INK}" opacity=".55" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">LANE ${i + 1}</text>`;
    for (const [b, col] of [[3, '#2b2523'], [63, METAL.m]]) s += shape(on(PZ(zt), ellUV(x0 + a + LW/2, y0 + b, 1.4, 1.4, 12)), METAL.l, .6) + shape(on(PZ(zt), ellUV(x0 + a + LW/2, y0 + b, .6, .6, 8)), col, .3); }
  s += fill(pd(R(lane(0) + LW, 9, lane(1), 57, .02)), FCM.m);   // the wall between the lanes
  s += `<path d="${ticks}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".35"/>`;
  for (let j = 0; j < 10; j++) s += fill(pd(R(28.3, 22 + j*2.2, 29.4, 22 + j*2.2 + (j % 3 ? .7 : 1.3))), '#f2efe7');
  for (const v of [.9, 1.5, 2.1]) s += fill(pd(R(4, 64.5 + v*.0, 26, 64.5 + .3)), FCM.d);
  // polonies: in every tile of both lanes once amplified; lit in the colour of the base just read
  if (st.stage >= 3) for (let i = 0; i < 96; i++){ const a = lane(i % 2) + .6 + (i*37 % 13)/13*8.8, b = 13.8 + (i*53 % 17)/17*42.5;
    s += fill(pd(on(PZ(zt + .03), ellUV(x0 + a, y0 + b, .4, .4, 6))), k > 0 ? BCOL[(READ[k - 1] + i*i + (i >> 1)*k) % 4] : '#ffffff', k > 0 && !im ? 'opacity=".5"' : ''); }
  // the tile being imaged, and the spot that is magnified
  const sx = x0 + lane(0) + LW/2, sy = y0 + 40;
  if (im) s += fill(pd(R(lane(0), 40.5, lane(0) + LW, 45, .035)), '#ffffff', 'opacity=".45"') + ink(pd(R(lane(0), 40.5, lane(0) + LW, 45, .035)), .9);
  s += ink(pd(on(PZ(zt + .04), rectUV(sx - 1, sy - 1, sx + 1, sy + 1))), 1.1);
  s += `<path d="${pd([[sx + 1, sy - 1, zt], [52, 16, SZ]], false)}${pd([[sx + 1, sy + 1, zt], [52, 114, SZ]], false)}" fill="none" stroke="${INK}" stroke-width="1" stroke-dasharray="${f(3*INK_K)} ${f(3*INK_K)}" opacity=".7"/>`;
  AV_LABELS.push({ at: [x0 + lane(1) + LW/2, y0 + 50, zt], text: 'FLOW CELL: 2 LANES', on: false }, { at: [x0 + lane(1) + LW, y0 + 49.5, zt], text: 'IMAGING TILE', on: im },
    ...(st.stage < 3 ? [{ at: [x0 + lane(1) + LW/2, y0 + 63, zt], text: 'INLET', on: wet }, { at: [x0 + 28.8, y0 + 44, zt], text: 'BARCODE', on: false }] : []));
  return s;
}

/* ---------- reading the signal: a card for the camera's four channel images, one for the brightness per channel, one for the call ---------- */
const CXC = 138, PAPER = matOf('#fbfaf3');
function card(y0, w, title, lines, hot, extra = ''){ const x0 = CXC, x1 = CXC + 1.2, z0 = 2, z1 = 26; let s = box(x0, y0, z0, x1, y0 + w, z1, PAPER, toneI, 1.1);
  if (facing([1,0,0])){ const X = x1 + .06; s += shape(on(PX(X - .02), rectUV(y0 + .3, z1 - 4.4, y0 + w - .3, z1 - .3)), hot ? 'var(--accent,#ef6a4c)' : '#3d3935', .6) + tx(X, y0 + w/2, z1 - 3.1, title, 1.7, hot ? INK : '#f6f2e6', 800);
    lines.forEach((ln, i) => { if (ln) s += tx(X, y0 + w/2, z1 - 7.6 - 3.1*i, ln[0], ln[2] || 1.45, ln[1] || INK, 700); }); s += extra; }
  return s; }
function signalCards(st){
  const A = st.anim, u = A ? st.u : 1, k = st.cyc, lit = A === 'seq' && u >= .3 && u < .6, shown = k > 0 && !(A === 'seq' && u < .3), g = A === 'seq' && u < .6 ? c01((u - .3)/.12) : 1;
  const called = shown ? READ[k - 1] : -1, I = ch => ch === called ? .92 : .07 + .05*((ch*7 + k) % 3), X = CXC + 1.26, F = facing([1,0,0]);
  let img = '', bars = '';
  if (F) for (let ch = 0; ch < 4; ch++){ const y = 98 + (ch % 2)*14, z0 = 11.9 - ((ch / 2) | 0)*9.8;
    img += fill(pd(on(PX(X), rectUV(y, z0, y + 12, z0 + 9.3))), '#1d2a26') + tx(X + .02, y + 1.6, z0 + 7.2, BASES[ch], 1.4, BCOL[ch], 800);
    for (let i = 0; i < 6; i++){ const py = y + 2 + (i*37 % 7)/7*8.5, pz = z0 + 1.2 + (i*53 % 11)/11*6.8, mine = i === 2, isOn = shown && (mine ? called === ch : ((i*i + k) % 4) === ch);
      img += fill(pd(on(PX(X + .02), ellUV(py, pz, mine ? 1 : .6, mine ? 1 : .6, 8))), isOn ? BCOL[ch] : '#2f4a40', isOn && g < 1 ? `opacity="${f(.2 + .8*g)}"` : ''); }
    if (shown) img += ink(pd(on(PX(X + .03), ellUV(y + 2 + (2*37 % 7)/7*8.5, z0 + 1.2 + (2*53 % 11)/11*6.8, 1.5, 1.5, 10))), .5); }
  if (F) for (let ch = 0; ch < 4; ch++){ const y = 66 + ch*6.4, h = shown ? 12.5*I(ch)*g : 0;
    bars += fill(pd(on(PX(X), rectUV(y, 6, y + 4.6, 6 + Math.max(.05, h)))), BCOL[ch]) + tx(X + .02, y + 2.3, 3.6, BASES[ch], 1.4, INK, 800); }
  if (F) bars += ink(pd(on(PX(X), rectUV(66, 6, 90.6, 6.0))), .6) + (shown ? `<path d="${pd(on(PX(X + .02), [[64.5, 6 + 12.5*.5], [92, 6 + 12.5*.5]]), false)}" fill="none" stroke="${INK}" stroke-width=".5" stroke-dasharray="1.2 1.2"/>` : '');
  const q = 36 + (k*7) % 4, n = Math.round(10**(q/10));
  return [
    { box: [[CXC, 96, 2], [CXC + 1.3, 126, 26]], svg: card(96, 30, 'CAMERA: 4 CHANNELS', [], lit, img) },
    { box: [[CXC, 62, 2], [CXC + 1.3, 92, 26]], svg: card(62, 30, 'SIGNAL PER POLONY', [], lit, bars) },
    { box: [[CXC, 28, 2], [CXC + 1.3, 58, 26]], svg: card(28, 30, 'BASE CALL', shown ? [[`CALL: ${BASES[called]}`, INK, 2.6], [`Q${q}: 1 ERROR IN ${n}`, INK, 1.4], ['WINNER vs RUNNER-UP', '#857d6e', 1.2], ['PHASING CORRECTED', '#857d6e', 1.2], [rdStr(k), FWDC, 1.5]] : [null, ['NO IMAGE YET', '#857d6e', 1.4]], A === 'seq' && u >= .45 && u < .6) } ];
}

/* ---------- the molecular patch ---------- */
let AV_LABELS = [];
function micro(st, m){
  const A = st.anim, u = A ? st.u : 1, items = [], put = (at, svg) => items.push({ at: W(at), svg }), lab = (at, text, on = false) => AV_LABELS.push({ at: W(at), text, on });
  let s = box(52, 16, 2, 130.4, 114, SZ, GLASS, toneI, 1.4);
  // lawn of surface primers
  let lp = null;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 4; r++){ const q = [4 + 9.5*c, 3.5 + 9.3*r]; if ([ST0, ...NBR].some(c => Math.hypot(q[0] - c[0], q[1] - c[1]) < 7)) continue;
    const pts = [0, 1, 2, 3, 4, 5].map(i => [q[0], q[1], 1.2 + i*.95]); put(pts[2], seg([[q[0], q[1], 0], pts[0]], INK, .6) + chain(pts, pts.map(() => PRM), FWDC)); if (c === 2 && r === 3) lp = pts[5]; }
  lab(lp, 'SURFACE PRIMER', A === 'hyb');
  const stage = st.stage;
  // how much product exists, and where the circle is
  const n = A === 'rca' ? Math.min(NT, 6 + Math.floor(u/.92*(NT - 6))) : stage >= 3 ? NT : 6, D = stage >= 2 ? Math.max(0, n - LAG) : 0;
  const tuck = stage >= 3 ? (A === 'rca' ? ease(c01((u - .9)/.1)) : 1) : 0;
  const Cf = [ST0[0], ST0[1], 19], Ch = ringC(D, tuck);
  // ---- neighbouring sites: a primer each; other circles land on them during Hybridize and amplify alongside (~1 billion per flow cell)
  NBR.forEach((c, t) => { const off = [c[0] - ST0[0], c[1] - ST0[1], 0], D2 = stage >= 3 ? Math.floor(D*.62) : 0;
    const hy = stage < 2 ? 0 : A === 'hyb' ? ease(c01((u - .3 - .2*t)/.45)) : 1, C2 = add(ringC(D2, tuck), off), Cup = add(C2, [0, 0, 14]);
    const nb = mm => (INS[mm - 6] + c[2]*mm + t + 1) % 4, pcol = mm => mm < 6 ? PRM : mm < 20 ? BCOL[nb(mm)] : SPS, ccol = q => q < 6 ? lite(PRM) : q < 20 ? BCOL[3 - nb(q)] : lite(SPS);
    if (stage >= 2){ const ring = Array.from({length:LN}, (_, q) => lerp(onRing(Cup, q, RC0), onRing(C2, q, RC0), hy));
      put(ring[12], `<g opacity="${f(.35 + .65*hy)}">${chain(ring, ring.map((_, q) => ccol(q)), TPLC, true)}</g>`); if (t === 0 && A === 'hyb') lab(ring[12], 'ANOTHER CIRCLE LANDS', hy < 1); }
    if (D2 < 3){ const pr = [0, 1, 2, 3, 4, 5].map(i => lerp([c[0], c[1], 1.2 + i*.95], onRing(C2, i, ROUT), hy > .9 ? 1 : 0));
      put(pr[2], seg([[c[0], c[1], 0], pr[0]], INK, .6) + chain(pr, pr.map(() => PRM), FWDC)); return; }
    const ball = Array.from({length:D2}, (_, i) => add(ballPos(i, D2), off)), nr = Math.min(6 + ((D2*3) % 12), LN - 2), ring2 = Array.from({length:nr}, (_, i) => onRing(C2, (D2 + i) % LN, ROUT));
    put(add(ballC(D2), off), seg([[c[0], c[1], 0], ball[0]], INK, .6) + chain(ball, ball.map((_, i) => pcol(i % LN)), FWDC) + seg([ball[ball.length - 1], ring2[0]], FWDC, 1.1));
    put(add(C2, [-.6, 0, 0]), chain(ring2, ring2.map((_, i) => pcol((D2 + i) % LN)), FWDC));
    if (A === 'rca' && u < .92) put(add(onRing(C2, (D2 + nr) % LN, ROUT), [2, 2, 2]), clamp(onRing(C2, (D2 + nr) % LN, (RC0 + ROUT)/2), m, 3.2, .7));
    if (t === 1) lab(add(ballC(D2), add(off, [0, 0, ballR(D2)])), 'NEIGHBOUR POLONY', A === 'rca'); });
  // ---- the library strand / circle
  { const circ = (C, q) => onRing(C, q, RC0), lin = q => [ST0[0], -.25 + ((q + 21) % 24)*1.5, 19];
    const e = stage === 0 ? 0 : A === 'circ' ? ease(c01((u - .12)/.5)) : 1, hy = stage < 2 ? 0 : A === 'hyb' ? ease(c01((u - .1)/.6)) : 1, C = lerp(Cf, Ch, hy);
    const pts = Array.from({length:LN}, (_, q) => lerp(lin(q), circ(C, q), e)), closed = stage >= 2 || (stage === 1 && (!A || u > .7));
    const ord = Array.from({length:LN}, (_, o) => (o + 3) % 24), cp = closed ? pts : ord.map(q => pts[q]), cc = closed ? pts.map((_, q) => CC(q)) : ord.map(q => CC(q));
    put(pts[12], `<g opacity="${f(1 - .3*tuck)}">${chain(cp, cc, TPLC, closed)}</g>` + (stage === 0 ? note(add(pts[3], [0, -1.6, 1.4]), "5'", TPLC) + note(add(pts[2], [0, 1.6, 1.4]), "3'", TPLC) : ''));
    lab(pts[13], stage === 0 ? 'LIBRARY STRAND' : stage === 1 ? 'CIRCLE, FREE IN SOLUTION' : stage === 2 ? 'LIBRARY CIRCLE' : tuck > .5 ? 'CIRCLE: INSIDE, NOT READ' : 'LIFTED TO SHOW THE LAPS', A === 'circ' || A === 'hyb' || (A === 'rca' && u > .9)); if (stage < 2){ lab(pts[21], 'PRIMER SITE', false); lab(pts[12], 'INSERT', false); }
    if (A === 'circ'){ const k = c01((u - .05)/.25), out = c01((u - .82)/.18), sp = [0, 1, 2, 3, 4, 5].map(q => add(lerp(add(lin(q), [1.4, 0, -8]), onRing(lerp(Cf, Ch, 0), q, ROUT), Math.min(k, e || k)), [0, 0, -9*out]));
      const spl = e > 0 ? [0, 1, 2, 3, 4, 5].map(q => add(lerp(add(pts[q], [1.5, 0, -1 - 6*(1 - k)]), onRing(Cf, q, ROUT), e), [0, 0, -9*out])) : sp;
      put(add(spl[2], [0, 0, -.5]), `<g opacity="${f(k*(1 - out))}">${rungs(spl, pts)}${chain(spl, spl.map(() => SPL), SPL)}</g>`); lab(spl[0], 'SPLINT', u < .8);
      if (u > .58 && u < .8){ const j = lerp(pts[2], pts[3], .5); put(add(j, [.5, 0, 0]), halo(j, 2.4, '#f4c430', .6) + note(add(j, [0, 0, -3.2]), 'LIGASE JOINS THE ENDS', INK, 2.8)); } }
    // the surface primer under the circle, then the growing product
    const C2 = stage >= 2 ? C : Ch, prodPos = j => j < D ? ballPos(j, D) : onRing(Ch, j % LN, ROUT);
    if (stage < 3 && A !== 'rca'){ const pr = [0, 1, 2, 3, 4, 5].map(i => lerp([ST0[0], ST0[1], 1.2 + i*.95], onRing(Ch, i, ROUT), hy));
      put(pr[2], seg([[ST0[0], ST0[1], 0], pr[0]], INK, .6) + (hy > .9 ? rungs(pr, pts) : '') + chain(pr, pr.map(() => PRM), FWDC)); if (stage === 2 && !A) lab(pr[5], "PRIMER 3' END", false); }
    else { const ringPts = [], ballPts = []; for (let j = 0; j < n; j++) (j < D ? ballPts : ringPts).push(prodPos(j));
      const cols = j0 => (_, i) => PC((j0 + i) % LN);
      if (ballPts.length) put(ballC(D), seg([[ST0[0], ST0[1], 0], ballPts[0]], INK, .6) + chain(ballPts, ballPts.map(cols(0)), FWDC) + (ringPts.length ? seg([ballPts[ballPts.length - 1], ringPts[0]], FWDC, 1.1) : ''));
      else put([ST0[0], ST0[1], .5], seg([[ST0[0], ST0[1], 0], ringPts[0]], INK, .6));
      put(add(Ch, [-.6, 0, 0]), rungs(ringPts, ringPts.map((_, i) => onRing(Ch, (D + i) % LN, RC0))) + chain(ringPts, ringPts.map(cols(D)), FWDC));
      if (A === 'rca' && u < .92){ const tip = onRing(Ch, n % LN, (RC0 + ROUT)/2), fr = (n*.25) % 1; put(add(tip, [2, 2, 2]), clamp(tip, m, 3.6));
        put(add(tip, [3, 3, 3]), dntp(lerp(POOL[(n >> 2) % 4], onRing(Ch, n % LN, ROUT), ease(fr)), PC(n % LN)));
        lab(tip, 'RCA POLYMERASE', true); lab(POOL[2], 'dNTP', true); lab(onRing(Ch, 12, RC0), 'ROLLING CIRCLE AMP.', true);
        lab(ringPts[ringPts.length >> 1], 'ONE LAP = ONE COPY', true); if (D > 20) lab(ballPos(Math.floor(D*.5), D), 'POLONY GENERATION', true); }
      if (stage >= 3 && A !== 'rca'){ lab(ballPos(Math.floor(D*.55), D), 'POLONY: MANY COPIES', A === 'prime'); lab(ballPos(0, D), 'FIXED 5 END', false); }
    }
  }
  // ---- sequencing primers and reads on each copy
  if (stage >= 4){ const pe = A === 'prime' ? ease(u) : 1, k = st.cyc, done = A === 'seq' ? k - 1 : k;
    const sbind = A === 'seq' && u < .72, pol2 = A === 'seq' && u >= .72 && u < .9;
    const dock = add(ballC(DFIN), [2, -13, 2]), pool = POOL[READ[Math.max(0, k - 1)]], col = k > 0 ? BCOL[READ[k - 1]] : '#fff';
    const ends = [];
    for (const c of SITES){ const tp = [23, 22, 21, 20].map(mm => tplAt(c, mm)), pr = tp.map(p => lerp(add(outOf(p, DFIN), [8, -4, 14]), outOf(p, DFIN), pe));
      const rd = Array.from({length:done}, (_, i) => outOf(tplAt(c, 19 - i), DFIN)), all = [...pr, ...rd];
      let x = `<g opacity="${f(pe)}">${chain(all, [...pr.map(() => lite(SPS)), ...READ.slice(0, done).map(b => mix(BCOL[b], '#ffffff', .3))], PRIM)}</g>`;
      const T = k > 0 ? outOf(tplAt(c, 20 - k), DFIN) : null;
      if (A === 'seq'){ ends.push(T);
        if (u < .72) x += clamp(T, m, 2.3, u < .1 ? u/.1 : u > .62 ? (.72 - u)/.1 : 1);
        if (u >= .72){ const e = ease(c01((u - .72)/.14)), p = lerp(POOL[(c + k) % 4], T, e), off = c01((u - .9)/.1);
          x += (u < .9 ? clamp(T, m, 2.3, .8) : '') + seg([all[all.length - 1], p], PRIM, 1.1, e) + bead(p, RB, col, 1, PRIM) + (off < 1 ? `<g opacity="${f(1 - off)}">${cap(add(p, [1 + 5*off, 0, .6 + 6*off]))}</g>` : '');
          if (c === 0){ lab(p, u < .9 ? 'BLOCKED NUCLEOTIDE' : '3 BLOCK REMOVED', true); if (u < .9) lab(T, 'SECOND POLYMERASE', true); } }
        else if (c === 0) lab(T, 'ENGINEERED POLYMERASE', u < .6); }
      if (c === 0 && A === 'seq' && u < .3) lab(all[all.length - 1], 'PRIMER 3 END', true);
      put(add(all[0], [.4, .4, .4]), x); if (c === 0 && !A) lab(pr[0], 'SEQUENCING PRIMER', false); if (c === 0 && A === 'prime') lab(pr[0], 'SEQUENCING PRIMER', true); }
    // the avidite that matches, binding many copies of the polony at once
    if (A === 'seq' && u < .72){ const e = ease(c01(u/.28)), out = ease(c01((u - .6)/.12)), core = lerp(lerp(pool, dock, e), add(dock, [4, -8, 14]), out), fe = freeEnds(core), lit = u >= .3 && u < .6 ? 1 : 0;
      const en = ends.map((T, i) => lerp(lerp(fe[i], T, e), fe[i], out));
      put(add(core, [6, 6, 6]), (lit ? halo(ballC(DFIN), ballR(DFIN) + 3.5, col, .28) : '') + avidite(core, en, col, lit, 1 - .9*out));
      lab(core, 'AVIDITE ' + BASES[READ[k - 1]] + ': CORE + DYES', true); lab(lerp(core, en[1], .5), 'ARM: ONE NUCLEOTIDE', u > .2 && u < .6); }
    // imaging: the objective above the polony; excitation light down, fluorescence from the bound dyes back up
    if (A === 'seq' && u >= .22 && u < .66){ const lit = u >= .3 && u < .6, fade = u < .3 ? c01((u - .22)/.08) : u >= .6 ? 1 - c01((u - .6)/.06) : 1;
      const O = [ST0[0], ST0[1], 27], B = ballC(DFIN), rr = ballR(DFIN) + 2.5, wo = W(O);
      const ring = (c, r, n) => Array.from({length:n}, (_, i) => { const a = i/n*2*Math.PI; return W([c[0] + r*Math.cos(a), c[1] + r*Math.sin(a), c[2]]); });
      const top = ring(O, 3.5, 14), bot = ring(B, rr, 14);
      let o = `<g opacity="${f(fade)}"><g opacity=".2">${loft(top, bot, () => '#fff3b0')}</g>` + (lit ? `<g opacity=".28">${loft(bot, top, () => col)}</g>` : '')
        + fill(pd(top), '#bfe3ee') + ink(pd(top), .8) + cyl(wo[0], wo[1], wo[2], wo[2] + 3*G, 3.6*G, matOf('#3d3935'), toneI, 1) + '</g>';
      put(O, o); lab(add(O, [0, 0, 4.5]), 'OBJECTIVE + CAMERA', lit); lab(lerp(O, B, .5), lit ? 'BOUND DYES FLUORESCE' : 'EXCITATION LIGHT', true); }
    // the four avidites waiting in solution
    if (stage >= 4 && A !== 'prime') for (let b = 0; b < 4; b++){ if (A === 'seq' && u < .72 && b === READ[k - 1]) continue; const fo = A === 'seq' && u >= .72 ? .25 : 1;
      put(POOL[b], avidite(POOL[b], freeEnds(POOL[b]), BCOL[b], 0, fo) + note(add(POOL[b], [0, 0, 3.4]), BASES[b], INK, 3)); }
    if (!A && k === 0) lab(POOL[1], 'AVIDITES', false);
  }
  return s + byDepth(items);
}

/* ---------- the reference, with the paper's numbers (a card standing along the left edge of the bench) ---------- */
function refCard(){ const y0 = 128.6, y1 = 129.8, x0 = 54, w = 76, z1 = 30; let s = box(x0, y0, 2, x0 + w, y1, z1, PAPER, toneI, 1.1);
  if (facing([0,1,0])){ const Y = y1 + .06, T = (z, str, size, col = INK) => txY(x0 + w/2, Y, z, str, size, col, 700);
    s += shape(on(PY(Y - .02), rectUV(x0 + .3, z1 - 4.6, x0 + w - .3, z1 - .3)), '#3d3935', .6) + T(z1 - 3.3, 'REFERENCE', 2.1, '#f6f2e6');
    [['Arslan et al., Nat Biotechnol 42, 132 (2024)', INK, 2.1], ['doi 10.1038/s41587-023-01750-7', '#857d6e', 1.9], ['CIRCLES LOADED AT 8 pM; RCA ON THE INSTRUMENT', INK, 1.8], ['ABOUT 1 BILLION POLONIES PER FLOW CELL', INK, 1.8],
     ['AVIDITES WORK AT nM, NOT uM; 4 COLOURS', INK, 1.8], ['96.2% OF BASES ABOVE Q30, 85.4% ABOVE Q40', INK, 1.8], ['READS SHOWN: 2 X 150 AND 1 X 300 CYCLES', INK, 1.8]].forEach((l, i) => { s += T(z1 - 8 - 3.25*i, l[0], l[2], l[1]); }); }
  return s; }

/* ---------- AVITI against Illumina, in one card ---------- */
function cmpCard(){ const y0 = 128.6, y1 = 129.8, x0 = 4, w = 46, z1 = 30; let s = box(x0, y0, 2, x0 + w, y1, z1, PAPER, toneI, 1.1);
  if (facing([0,1,0])){ const Y = y1 + .06, T = (z, str, size, col = INK) => txY(x0 + w/2, Y, z, str, size, col, 700);
    s += shape(on(PY(Y - .02), rectUV(x0 + .3, z1 - 4.6, x0 + w - .3, z1 - .3)), '#3d3935', .6) + T(z1 - 3.3, 'AVITI  vs  ILLUMINA', 2.1, '#f6f2e6');
    [['TEMPLATE: CIRCLE | LINEAR STRAND', INK], ['AMPLIFY: ROLLING CIRCLE | BRIDGE', INK], ['POLONY: ONE LONG STRAND | ~1000 STRANDS', INK], ['READ: AVIDITE BINDS | LABELLED dNTP JOINS', INK],
     ['STEP: PLAIN BLOCKED dNTP | THE SAME dNTP', INK], ['REPORTER: nM | uM', INK], ['LANES: 2 | 1 TO 8', '#857d6e'], ['ERRORS NOT COPIED ON | COPIED IN EVERY ROUND', '#857d6e']].forEach((l, i) => { s += T(z1 - 8 - 2.65*i, l[0], 1.3, l[1]); }); }
  return s; }

/* ---------- scene ---------- */
function scene(st, m){
  const btop = boardTop(0, 0, BX, BY, 2, 5), cs = (a, b) => { const o = []; for (const x of [a[0], b[0]]) for (const y of [a[1], b[1]]) for (const z of [a[2], b[2]]) o.push([x, y, z]); return o; };
  AV_LABELS = [];
  let s = board(0, 0, BX, BY, 2, 5) + castShadow(cs([8, 32, 2], [38, 98, 5.2]), 2, btop) + castShadow(cs([52, 16, 2], [130.4, 114, SZ]), 2, btop) + castShadow(cs([54, 128.6, 2], [130, 129.8, 30]), 2, btop) + castShadow(cs([4, 128.6, 2], [50, 129.8, 30]), 2, btop); for (const y of [28, 62, 96]) s += castShadow(cs([CXC, y, 2], [CXC + 1.2, y + 30, 26]), 2, btop);
  s += byDepth([{ box: [[8, 32, 2], [38, 98, 6]], svg: flowCell(st) }, { box: [[52, 16, 2], [134, 116, 86]], svg: micro(st, m) }, { box: [[54, 128.6, 2], [130, 129.9, 30]], svg: refCard() }, { box: [[4, 128.6, 2], [50, 129.9, 30]], svg: cmpCard() }, ...signalCards(st)]);
  return s + xrCallouts(AV_LABELS, [0, 100, 30, 900, 0, 40]);
}

/* ---------- behaviour ---------- */
let ui;
function play(st, name, secs, note2){ st.anim = name; st.u = 0; if (note2) ui.flash(note2, 3800);
  ui.animate(dt => { st.u = Math.min(1, st.u + dt/secs); if (st.u >= 1){ st.anim = null; return false; } return true; }); }
const NEXT = ['Circularize', 'Hybridize', 'Rolling circle amplification', 'Prime'];
function go(st, n){ if (st.anim) return ui.flash('One moment'); if (st.stage >= n) return ui.flash('Already done'); if (st.stage < n - 1) return ui.flash('First: ' + NEXT[st.stage]);
  st.stage = n;
  if (n === 1) play(st, 'circ', 5, 'Done in a tube before loading: a splint holds the two ends together and ligase closes the circle');
  if (n === 2) play(st, 'hyb', 4.5, 'Circles are flowed in at 8 pM; each one drifts until it pairs with a surface primer');
  if (n === 3){ play(st, 'rca', 12, 'ROLLING CIRCLE AMPLIFICATION: a strand-displacing polymerase (phi29 type) runs round the circle, copying it');
    const said = {}; ui.animate(() => { if (st.anim !== 'rca') return false;
      for (const [t, msg] of [[.3, 'Each lap peels the previous lap off: the copies stay joined in one long strand'], [.55, 'POLONY GENERATION: the strand folds into a ball of identical copies, fixed by its 5 end'], [.75, 'Every copy is read off the original circle, so a copying error is not passed on'], [.9, 'Done: the circle settles inside the polony. It stays as template but is never read']])
        if (st.u >= t && !said[t]){ said[t] = 1; ui.flash(msg, 3600); } return true; }); }
  if (n === 4) play(st, 'prime', 2.5, 'A sequencing primer pairs with the same site in every copy'); }
function sequence(st){ if (st.anim) return ui.flash('One moment'); if (st.stage < 4) return ui.flash('First: ' + NEXT[st.stage]); if (st.cyc >= NCYC) return ui.flash('Read complete: 300 cycles');
  st.cyc++; play(st, 'seq', 9, st.cyc === NCYC ? 'Cycles 6 to 299 are not shown; the paper shows a 300-cycle read' : 'Bind: an avidite holds many copies at once. Image in 4 channels. Wash. Then add one blocked base and unblock');
  const said = {}; ui.animate(() => { if (st.anim !== 'seq') return false; for (const [t, msg] of [[.3, 'Image: laser light excites the bound dyes; the camera records each channel'], [.45, 'Call: the brightest channel is the base; Q from winner vs runner-up'], [.6, 'Avidites and polymerases are washed off; nothing was joined'], [.72, 'Step: one unlabelled, blocked nucleotide is joined'], [.9, 'Unblock: ready for the next cycle']])
      if (st.u >= t && !said[t]){ said[t] = 1; ui.flash(msg, 2600); } return true; }); }

ui = mountFigure({
  fig:'21', turn:'full', title:'AVITI: rolling circle amplification and sequencing by avidity',
  size:[BX, BY, 96], palette:'tomato',
  state:{ stage:0, cyc:0, anim:null, u:0 },
  scene,
  buttons:[
    { label:'Circularize', onClick: st => go(st, 1) }, { label:'Hybridize', onClick: st => go(st, 2) }, { label:'Rolling circle amplification', onClick: st => go(st, 3) },
    { label:'Prime', onClick: st => go(st, 4) }, { label:'Sequence', onClick: st => sequence(st) },
    { label:'Paper', onClick: () => { window.open('https://www.nature.com/articles/s41587-023-01750-7', '_blank'); } },
    { label:'Reset', onClick: st => { if (st.anim) return ui.flash('One moment'); st.stage = 0; st.cyc = 0; st.u = 0; } },
    { label:'Illumina flow cell', onClick: () => { location.href = 'flowcell-closeup.html'; } },
    { label:'Illumina sequencer', onClick: () => { location.href = 'sequencer-flowcell.html'; } },
  ],
  stats: st => [ { label:'Cycle', value: `${cycNo(st.cyc)}/${RLEN}` },
    { label:'Polonies on the flow cell', small:true, value: st.stage < 3 ? 0 : '~1 billion' },
    { label:'Laps = copies', small:true, value: st.stage < 3 ? (st.stage === 2 ? 0 : '-') : st.anim === 'rca' ? Math.floor((6 + st.u/.92*(NT - 6))/LN) : 'many' },
    { label:'Read', small:true, value: rdStr(st.anim === 'seq' && st.u < .3 ? st.cyc - 1 : st.cyc) || '-' } ],
  params:(st, q) => { for (const k of ['stage', 'cyc', 'u']) if (q.has(k)) st[k] = +q.get(k); if (q.has('anim')) st.anim = q.get('anim'); },
});
xrMount(() => ui, () => '', { labelsOnly:true });
</script></body></html>
